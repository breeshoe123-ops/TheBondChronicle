<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bond Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IM+Fell+English&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;500&display=swap" 
rel="stylesheet">
<style>
  :root{
    --ink: #21281f;
    --paper: #EEE6CE;
    --paper-light: #F7F0DC;
    --spine: #2f3d2f;
    --spine-dark: #232e23;
    --gold: #a9863f;
    --gold-light: #c9a15f;
    --spine-gold: #b08a47;
    --wax: #7a2e2e;
    --wax-light: #9c4a44;
    --line: rgba(33,40,31,0.16);
    --line-strong: rgba(33,40,31,0.32);
    --green-alive: #3d5a3d;
    --shadow: 0 2px 10px rgba(33,40,31,0.12);
  }
  @font-face {
  font-family: 'Manuskriptgotisch';
  src: url('Manuskriptgotisch-X3yd.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body { font-family: 'Source Sans 3', sans-serif; background-color: var(--paper); background-image: url('https://t4.ftcdn.net/jpg/00/94/93/01/360_F_94930136_2rJCn33glIkmMpXdHFb474gTCF7ET38M.jpg'),
linear-gradient(rgba(255,255,255,.12), rgba(117,91,48,.035)), repeating-linear-gradient(0deg, rgba(91,70,36,.035) 0, rgba(91,70,36,.035) 1px, transparent 1px, transparent 4px), repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0, rgba(255,255,255,.08) 1px, transparent 1px, transparent 7px); background-size: auto, 28px 28px, 28px 28px; background-attachment: scroll; color: var(--ink); -webkit-font-smoothing: antialiased; }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(circle at 18% 22%, rgba(169,134,63,0.08) 0, transparent 2px), radial-gradient(circle at 72% 68%, rgba(122,46,46,0.05) 0, transparent 2px);
    background-size:19px 17px, 23px 21px;
    pointer-events:none;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; letter-spacing:0.01em; }
  #app{ display:flex; min-height:100vh; }
.rules-copy h3 {
  text-align: center;
  font-size: 1.6rem;
}
  .page-head h2, .sim-hero h3, .j-day, .decade-year{ font-family:'IM Fell English','Fraunces',serif; }
  .spine{
    width:220px; flex-shrink:0;
    height:100vh;
    background-image: url('https://cdn.phototourl.com/free/2026-09-14-8a3c7b6c-a261-4b41-b785-b4cb2d70dee3.png');
    background-size: 100% 100%;
    background-color: #181C12;
    background-position: center;
    background-repeat: no-repeat;
    color: var(--spine-gold);
    padding: 64px 0 28px;
    position:sticky; top:0;
    box-shadow: inset -10px 0 18px rgba(0,0,0,0.24), inset 8px 0 14px rgba(201,161,95,0.08), 5px 0 0 rgba(169,134,63,0.28);
  }
  .spine::before{
    content:"";
    position:absolute; inset:12px 10px;
    border:1px solid rgba(176,138,71,0.28);
    box-shadow: inset 0 0 0 3px rgba(24,28,18,0.2), inset 0 0 0 4px rgba(176,138,71,0.14);
    pointer-events:none;
  }
  .spine-title{
    padding: 0 8px 10px;
    margin-bottom: 10px;
    text-align:center;
  }
  .spine-title .eyebrow{
    font-family:'Manuskriptgotisch','IM Fell English',serif;
    width:180px; 
    max-width:100%; 
    font-size:20px; 
    letter-spacing:0.02em; 
    color: var(--spine-gold);
    white-space:normal; 
    display:block; margin:0 auto 10px;
    line-height:1.05; 
    text-align:center;
    transform: translateY(-20px);
    mix-blend-mode: color-dodge;
  }
  .spine-title h1{ font-family:'IM Fell English','Fraunces',serif; font-size:24px; margin:0; line-height:1.2; font-weight:400; letter-spacing:0.04em; color:var(--spine-gold); }
  .spine-title h1, .spine-nav button, .spine-foot button, .autosave-note{ text-shadow:0 1px 1px rgba(20,18,10,0.85), 1px 0 0 rgba(20,18,10,0.35); }
  .spine-nav button.active{ text-shadow:1px 1px 0 #6b4e20, 0 0 5px rgba(120,88,32,0.78); }
  nav.spine-nav{ display:flex; flex-direction:column; align-items:center; }
  .spine-nav button{
    all:unset; cursor:pointer;
    width:100%;
    padding: 13px 18px;
    font-family:'IM Fell English','Fraunces',serif;
    font-size:16px;
    letter-spacing:0.035em;
    color: var(--spine-gold);
    border:0;
    text-align:center;
    transition: all .15s ease;
  }
  .spine-nav button:hover{ color: var(--spine-gold); background: transparent; }
  .spine-nav button.active{
    color: var(--spine-gold);
    background: transparent;
    box-shadow:none;
    font-weight: 400;
  }
  .spine-nav button.active::before, .spine-nav button.active::after{ content:"✦"; color:var(--spine-gold); margin:0 8px; font-size:11px; vertical-align:middle; }
  .spine-foot{
    position:absolute; bottom:35px; left:0; right:0;
    padding: 0 18px;
    display:flex; flex-direction:column; gap:0;
    align-items:center; text-align:center;
  }
  .spine-foot button{
    all:unset; cursor:pointer;
    font-family:'IM Fell English','Fraunces',serif;
    font-size:13px; letter-spacing:0.02em; color: var(--spine-gold);
    padding:0;
  }
  .spine-foot button:hover{ color: var(--spine-gold); }
  .autosave-note{ font-family:'IM Fell English','Fraunces',serif; font-size:11px; color: var(--spine-gold); margin-top:0; line-height:1.1; }
  #file-input{ display:none; }

  main{ flex:1; padding: 40px 48px 60px; max-width: none; }
  .page-head{ margin-bottom: 30px; }
  .page-head .eyebrow{ font-size:12px; letter-spacing:0.1em; color: var(--wax); font-weight:600; }
  .page-head h2{ font-size:30px; margin: 4px 0 6px; }
  .page-head p{ margin:0; color: rgba(33,40,31,0.65); max-width: 62ch; line-height:1.5; }

  .card{
    background: transparent;
    border-image-slice: 172 172 172 172;
    border-image-width: 30px 30px 30px 30px;
  border-image-outset: 20px;
  border-image-repeat: repeat;
  border-image-source: url("border.png");
  }
  .card + .card{ margin-top: 22px; } 
  .card-pad{ padding: 24px 26px; }

  .line-art {
    width: 85%;
    height: 11px;
    margin: 0 auto 8px;
    position: relative;
  }
  .line-art::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("lineart3.png");
    background-repeat: stretch;
    background-position: center;
    background-size: contain;
    height: 11px;
  }

  .today-hero{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
  .today-day-input{
    font-family:'Fraunces', serif; font-size:56px; line-height:1;
    font-weight:700; color: var(--spine); width: 140px;
    border:none; background:transparent; padding:0;
  }
  .card + .card {
    margin-top: 70px;
  }
  .today-day-input:focus{ outline: none; border-bottom: 2px solid var(--gold); }
  .today-meta{ display:flex; flex-direction:column; gap:4px; }
  .today-meta .weekday{ font-size:18px; font-weight:600; color: var(--wax); }
  .today-meta .year{ font-size:13px; color: rgba(33,40,31,0.6); }
  .day-controls{ margin-left:auto; }
  button.btn{
    all:unset;
    cursor:pointer;
    padding:9px 14px;
    border-radius:3px;
    font-family:'Source Sans 3';
    font-size:20px;
    font-weight:600;
    background:var(--paper-light);
    color:var(--spine);
    border:1px solid var(--line-strong);
    transition:background .15s ease;
  }
  button.btn:hover{ background:var(--paper); }
  button.btn.green{ background:var(--spine); color:var(--paper-light); }
  button.btn.green:hover{ background:var(--spine-dark); }
  button.btn.selected{ background:var(--spine); color:var(--paper-light); }
  button.btn.selected:hover{ background:var(--spine-dark); }
  button.btn.red{ background:var(--wax); color:var(--paper-light); }
  button.btn.red:hover{ background:var(--wax-light); }
  button.btn.small{ padding:6px 10px; font-size:18px; }

  .text-link{ color:var(--wax); font-size:12.5px; font-weight:600; text-decoration:underline; text-underline-offset:2px; cursor:pointer; display:inline-block; }
  .text-link:hover{ color:var(--wax-light); }

  .section-title{
    font-size:20px; 
    letter-spacing:0.06em; 
    font-weight:600; 
    color: var(--spine);
    margin: 0 0 14px; 
    padding-bottom:3px; 
    display:flex; 
    justify-content:space-between; 
    align-items:center;
  }

  .cal-strip{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .cal-card{
    flex-shrink:0; width:126px; min-height:152px; text-align:center; padding:10px 8px;
    border:1px solid var(--line); border-radius:4px; background:#fff;
    cursor:pointer; transition: border-color .15s ease;
  }
  .cal-card:hover{ border-color: var(--gold); }
  .cal-card.today{ background: var(--spine); border-color: var(--spine); }
  .cal-card.today .cal-dow, .cal-card.today .cal-daynum{ color: var(--paper-light); }
  .cal-card.today .day-events{ color: var(--paper-light); }
  .cal-card .cal-dow{ font-size:10px; letter-spacing:0.05em; color: rgba(33,40,31,0.5); }
  .cal-card .cal-daynum{ font-family:'Fraunces',serif; font-size:20px; font-weight:700; margin:2px 0; }
  .cal-card .cal-dot{ height:5px; width:5px; border-radius:50%; background: var(--wax); margin: 0 auto; visibility:hidden; }
  .cal-card.has-event .cal-dot{ visibility:visible; }
  .day-events{ margin-top:7px; text-align:left; font-size:10px; line-height:1.25; color:var(--wax); }
  .sim-link{ color:inherit; text-decoration:none; cursor:pointer; font-weight:600; }
  .roster-portrait{ width:36px; height:36px; object-fit:cover; vertical-align:middle; margin-right:8px; border:1px solid var(--line-strong); background:rgba(47,61,31,.08); border-radius:3px; }
  .roster-portrait-empty{ display:inline-block; }
  .upcoming-list li{ cursor:pointer; }
  .calendar-year-band{ display:flex; gap:8px; margin-bottom:6px; }
  .calendar-year-band span{ flex:1; font:600 12px 'Fraunces',serif; color:var(--wax); text-align:center; border-bottom:3px solid var(--line-strong); padding-bottom:4px; }
  .calendar-year-band .year-group{ flex:1; display:flex; justify-content:center; font:600 12px 'Fraunces',serif; color:var(--wax); border-bottom:3px solid var(--line-strong); padding-bottom:4px; }
  .calendar-year-band .year-group span{ border:0; padding:0; }
  .calendar-header-card{ margin-bottom:22px; }
  .calendar-view-row{ display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; }
  .calendar-view-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .calendar-view-label, .calendar-filter-label{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:rgba(33,40,31,.52); font-weight:700; }
  .calendar-modes{ display:flex; justify-content:center; gap:25px; flex-wrap:wrap; }
  .calendar-location-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
    gap:10px; flex-wrap:wrap;
  }
  .calendar-location-row .today-btn-wrap{ flex:0 0 auto; min-width:90px; }
  .calendar-location-row .today-btn{ white-space:nowrap; }
  .calendar-location-controls{ display:flex; align-items:center; justify-content:center; gap:10px; flex:1; }
  .calendar-location-row .calendar-location-title{ min-width:150px; text-align:center; font:600 18px 'Fraunces',serif; color:var(--spine); }
  .calendar-location-row .today-btn-spacer{ flex:0 0 auto; min-width:90px; }
  .calendar-filters{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .calendar-search-input{ padding:8px 10px; border:1px solid var(--line-strong); border-radius:3px; font-family:'Source Sans 3'; font-size:13px; background:var(--paper-light); color:var(--ink); width:230px; }
  #jump-to-year{ -moz-appearance:textfield; }
  #jump-to-year::-webkit-outer-spin-button, #jump-to-year::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .filter-dropdown{ position:relative; }
  .filter-dropdown-btn{ all:unset; cursor:pointer; display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--line-strong); border-radius:3px; font-family:'Source Sans 3'; font-size:13px; background:var(--paper-light); color:var(--ink); min-width:180px; white-space:nowrap; transition:border-color .15s ease; box-sizing:border-box; }
  .filter-dropdown-btn:hover{ border-color:var(--gold); }
  .filter-dropdown-btn .fd-arrow{ margin-left:auto; font-size:10px; transition:transform .15s ease; }
  .filter-dropdown-btn.open .fd-arrow{ transform:rotate(180deg); }
  .filter-dropdown-panel{ display:none; position:absolute; top:calc(100% + 4px); left:0; z-index:100; background:var(--paper-light); border:1px solid var(--line-strong); border-radius:3px; box-shadow:0 6px 20px rgba(33,40,31,0.15); min-width:200px; padding:6px 0; }
  .filter-dropdown-panel.open{ display:block; }
  .filter-dropdown-item{ display:flex; align-items:center; gap:10px; padding:8px 14px; cursor:pointer; font-family:'Source Sans 3'; font-size:13px; color:var(--ink); transition:background .1s ease; user-select:none; }
  .filter-dropdown-item:hover{ background:rgba(169,134,63,0.1); }
  .filter-dropdown-item input[type=checkbox]{ accent-color:var(--spine); width:14px; height:14px; flex-shrink:0; cursor:pointer; }
  .filter-dropdown-item.all-item{ border-bottom:1px solid var(--line); margin-bottom:4px; padding-bottom:10px; }
  .calendar-filters .spacer{ flex:1; }
  .calendar-content-card{ min-height:120px; }
  .calendar-scroll-top{
    position:fixed !important; right:48px !important; left:auto !important; bottom:24px !important; z-index:1000;
    opacity:0 !important; pointer-events:none !important; transform:translateY(8px) !important;
    transition:opacity .18s ease, transform .18s ease; box-shadow:var(--shadow);
  }
  .calendar-scroll-top.visible{ opacity:1 !important; pointer-events:auto !important; transform:translateY(0) !important; }
  .decade-year-card{ min-height:220px; padding:22px; border:1px solid var(--line); background:#fff; border-radius:4px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s ease, transform .15s ease; display:flex; flex-direction:column; }
  .decade-year-card:hover{ border-color:var(--gold); transform:translateY(-1px); }
  .decade-year-card.current{ border:2px solid var(--wax); padding:21px; }
  .decade-year-card .year-title{ font:600 25px 'Fraunces',serif; color:var(--spine); margin-bottom:12px; }
  .decade-year-card .year-summary{ font-size:12px; color:rgba(33,40,31,.58); margin-bottom:12px; }
  .decade-year-card .year-preview{ display:flex; flex-direction:column; gap:7px; margin-top:auto; }
  .decade-year-card .year-preview-line{ font-size:12px; color:var(--wax); line-height:1.3; }
  .decade-year-card .year-preview-day{ font-weight:700; color:var(--spine); margin-right:6px; }
  .timeline-year-link{ all:unset; cursor:pointer; display:block; margin:26px 0 10px; font:600 20px 'Fraunces',serif; color:var(--spine); }
  .timeline-year-link:first-child{ margin-top:0; }
  .timeline-year-link:hover{ color:var(--wax); }
  .calendar-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .calendar-toolbar .controls{ display:flex; gap:8px; align-items:center; }
  
  .event-icon-btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; vertical-align:middle; border-radius:3px; background:transparent; transition:background 0.15s ease; }
  .event-icon-btn img { width:14px; height:14px; object-fit:contain; }
  .event-icon-btn:hover { background:rgba(47,61,47,0.2); }
  .year-day .event-line, .year-day-large .event-line, .day-hero-card .event-line { display:flex; align-items:center; margin-top:6px; font-size:11px; color:var(--wax); line-height:1.3; }
  .day-view-events li { display:flex; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); color:var(--wax); }

  .section-title .right{ display:flex; gap:8px; }
  .decade-year{ margin:26px 0 10px; font:600 20px 'Fraunces',serif; color:var(--spine); }
  .decade-year:first-child{ margin-top:0; }
  .year-grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  .year-day{ min-height:152px; padding:8px; border:1px solid var(--line); background:#fff; border-radius:3px; }
  .year-day.current{ border:2px solid var(--wax); padding:7px; }
  .year-day .day-label{ font:600 15px 'Fraunces',serif; color:var(--spine); }
  .year-day .day-week{ display:block; font-size:10px; color:rgba(33,40,31,.52); }
  .day-view-events{ list-style:none; padding:0; margin:0; }

  .year-grid-large{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px; }
  .year-day-large{ min-height:240px; padding:22px 24px; border:1px solid var(--line); background:#fff; border-radius:4px; box-shadow:var(--shadow); display:flex; flex-direction:column; }
  .year-day-large.current{ border:2px solid var(--wax); padding:21px 23px; }
  .year-day-large .day-label{ font:600 21px 'Fraunces',serif; color:var(--spine); display:block; }
  .year-day-large .day-week{ display:block; font-size:12.5px; color:rgba(33,40,31,.55); margin-bottom:14px; }
  .year-day-large .event-line{ font-size:13px; margin-top:9px; }
  .year-day-large .event-line .event-icon-btn{ width:22px; height:22px; }
  .year-day-large .event-line .event-icon-btn img{ width:15px; height:15px; }

  .day-hero-wrap{ display:flex; justify-content:center; }
  .day-hero-card{ width:100%; max-width:820px; min-height:300px; padding:36px 44px; border:1px solid var(--line); background:#fff; border-radius:4px; box-shadow:var(--shadow); }
  .day-hero-card.current{ border:2px solid var(--wax); padding:35px 43px; }
  .day-hero-card .day-label{ font:600 30px 'Fraunces',serif; color:var(--spine); display:block; }
  .day-hero-card .day-week{ display:block; font-size:15px; color:rgba(33,40,31,.55); margin:4px 0 18px; }
  .day-hero-card .day-view-events{ margin-top:4px; }
  .sim-hero{ display:flex; gap:24px; align-items:flex-start; }
  .sim-photo-col{ flex-shrink:0; width:200px; }
  .sim-hero-info{ flex:1; min-width:0; }
  .sim-photo{ width:100%; aspect-ratio:1/1; object-fit:cover; object-position:center top; background:rgba(47,61,47,.08); border:2px solid var(--line-strong); border-radius:4px; display:block; }
  .sim-photo-empty{ display:flex; align-items:center; justify-content:center; color:rgba(33,40,31,.4); font:22px 'Fraunces',serif; border-radius:4px; border:2px solid var(--line-strong); aspect-ratio:1/1; width:100%; background:rgba(47,61,47,.05); }
  .sim-info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:20px; }
  .sim-info-grid label, .library-field label{ display:block; font-size:12px; color:rgba(33,40,31,.6); margin-bottom:5px; }
  .sim-info-grid input, .sim-info-grid select, .library-field input{ width:100%; padding:8px; border:1px solid var(--line-strong); border-radius:3px; background:#fff; font-family:'Source Sans 3'; font-size:13.5px; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; min-height:22px; }
  .tag-chip{ display:inline-flex; align-items:center; gap:6px; background:rgba(47,61,47,0.12); color:var(--spine); font-size:12px; font-weight:600; padding:4px 9px; border-radius:3px; }
  .tag-chip.static{ background:rgba(47,61,47,0.08); }
  .tag-chip button{ all:unset; cursor:pointer; font-size:14px; line-height:1; color:var(--wax); }
  .empty-tag{ color:rgba(33,40,31,0.4); font-size:12.5px; font-style:italic; }
  .tag-input-row{ display:flex; gap:8px; }
  .tag-input-row input{ flex:1; padding:8px; border:1px solid var(--line-strong); border-radius:3px; background:#fff; font-size:13px; }
  /* TAL select2 dropdown */
  .tal-select-wrap{ position:relative; }
  .tal-select-input{ width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:3px; background:#fff; font-family:'Source Sans 3'; font-size:13px; color:var(--ink); }
  .tal-select-input:focus{ outline:none; border-color:var(--gold); }
  .tal-dropdown{ display:none; position:absolute; top:calc(100% + 2px); left:0; right:0; z-index:200; width: 100% !important; box-sizing: border-box !important;background:var(--paper-light); border:1px solid var(--line-strong);
    border-radius:3px; box-shadow:0 6px 18px rgba(33,40,31,0.15); max-height:180px; overflow-y:auto; }
  .tal-dropdown.open{ display:block; }
  .tal-option{ padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink); transition:background .1s ease; display: flex !important;justify-content: space-between !important; align-items: center !important; width: 100% !important;
  box-sizing: border-box !important; }

  .sim-field-input .tal-select-wrap{ width:100%; }
  .sim-field-input .tal-select-input{ width:100%; }

  .sim-section-head.collapsible.collapsed::after{ transform:rotate(180deg); }
  .sim-collapsible-body{ overflow:hidden; transition:max-height .25s ease, opacity .2s ease; max-height:2000px; opacity:1; }

</style>

<body>
<div id="app"></div>
<input type="file" id="file-input" accept="application/json">

<script>
/* ---------------------------------------------------------
   CENTRAL ICON CONFIGURATION
--------------------------------------------------------- */
const ICONS = {
  births: 'born.png',
  birthdays: 'bday.png',
  deaths: 'death.png',
  expiration: 'exp.png',
  'historical-wars': 'sword.png',
  'historical-outbreaks': 'ill.png',
  'historical-famines': 'tummy.png',
  'historical-others': 'scroll.png'
};

/* ---------------------------------------------------------
   DATA MODEL
--------------------------------------------------------- */
const WEEKDAYS = ['TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY','MONDAY'];
const STORAGE_KEY = 'bondChronicleData_v3';

const DEFAULT_OFFSETS = { infant:1, toddler:7, child:24, teen:52, youngAdult:80, adult:120, elder:200 };
const STAGE_SEQUENCE = ['infant','toddler','child','teen','youngAdult','adult','elder'];
const STAGE_LABELS = { infant:'Becomes Infant', toddler:'Becomes Toddler', child:'Becomes Child',
  teen:'Becomes Teen', youngAdult:'Becomes Young Adult', adult:'Becomes Adult', elder:'Becomes Elder' };

function cryptoId(){ return 'id-' + Math.random().toString(36).slice(2,10); }

function buildDefaultState(){
  const cedricId = cryptoId();
  const imogenId = cryptoId();
  const rosalindId = cryptoId();
  const thomasId = cryptoId();
  const annabelId = cryptoId();
  return {
    currentDay: 23,
    offsets: Object.assign({}, DEFAULT_OFFSETS),
    notes: {},
    historicalEvents: [],
    libraries: { traits:[], aspirations:[], lifestyles:[], nationalities:[], families:[], lastNames:[] },
    relationsMigrated: true,
    sims: [
      { id:cedricId, firstName:'Cedric', lastName:'Bond', generation:'P1st', parentIds:[], spouseId:imogenId,
        sex:'M', birthDay:-79, yearBorn:1279, status:'Alive', yearOfDeath:'', causeOfDeath:'',
        nationality:'English', family:'Bond Family P1st', yearMarried:1300, notes:'',
        traits:[], aspirations:[], lifestyles:[], aspirationCompleted:{} },
      { id:imogenId, firstName:'Imogen', lastName:'Bond', generation:'P1st', parentIds:[], spouseId:cedricId,
        sex:'F', birthDay:-78, yearBorn:1280, status:'Alive', yearOfDeath:'', causeOfDeath:'',
        nationality:'English', family:'', yearMarried:1300, notes:'',
        traits:[], aspirations:[], lifestyles:[], aspirationCompleted:{} },
      { id:rosalindId, firstName:'Rosalind', lastName:'Bond', generation:'P2nd', parentIds:[cedricId, imogenId], spouseId:'',
        sex:'F', birthDay:7, yearBorn:1301, status:'Alive', yearOfDeath:'', causeOfDeath:'',
        nationality:'English', family:'', yearMarried:'', notes:'',
        traits:[], aspirations:[], lifestyles:[], aspirationCompleted:{} },
      { id:thomasId, firstName:'Thomas', lastName:'Bond', generation:'P2nd', parentIds:[cedricId, imogenId], spouseId:'',
        sex:'M', birthDay:14, yearBorn:1303, status:'Alive', yearOfDeath:'', causeOfDeath:'',
        nationality:'English', family:'', yearMarried:'', notes:'',
        traits:[], aspirations:[], lifestyles:[], aspirationCompleted:{} },
      { id:annabelId, firstName:'Annabel', lastName:'Bond', generation:'P2nd', parentIds:[cedricId, imogenId], spouseId:'',
        sex:'F', birthDay:14, yearBorn:1303, status:'Alive', yearOfDeath:'', causeOfDeath:'',
        nationality:'English', family:'', yearMarried:'', notes:'',
        traits:[], aspirations:[], lifestyles:[], aspirationCompleted:{} },
    ]
  };
}

let state = loadState();
let view = 'timeline';
let selectedDay = null;
let rosterSearch = '';
let rosterView = 'list';
let rosterSortCol = 'birthDay';
let rosterSortDir = 1;
let calendarDecade = 1300;
let calendarYear = 1300;
let calendarSearch = '';
let calendarMode = 'decade';
let calendarCategory = ['all'];
let calendarIncludePast = false;
let editingSimId = null;
let modal = null;
let cropSimId = null;
let listFilterCategory = null;
let simEditMode = false;
let calendarScrollHandler = null;
let filterDropdownOpen = false;
// pending new-sim data that was triggered from "add child" flow
let pendingChildParentId = null;

function migrateRelations(parsed){
  if(parsed.relationsMigrated) return;
  const byName = new Map(parsed.sims.map(s => [`${s.firstName} ${s.lastName}`.toLowerCase(), s]));
  parsed.sims.forEach(sim => {
    if(!Array.isArray(sim.parentIds)){
      sim.parentIds = [];
      const relation = sim.relation || '';
      const match = relation.match(/(?:daughter|son|child)\s+of\s+(.+)/i);
      if(match){
        match[1].replace(/\s+bond\b/gi, ' Bond').split(/\s*(?:&|\band\b)\s*/i).forEach(name => {
          const clean = name.trim().replace(/[.,]+$/, '').toLowerCase();
          const parent = byName.get(clean);
          if(parent) sim.parentIds.push(parent.id);
        });
      }
    }
    if(!sim.spouseId){
      const relation = sim.relation || '';
      const marriedMatch = relation.match(/married to\s+(.+)/i);
      if(marriedMatch){
        const clean = marriedMatch[1].trim().replace(/[.,]+$/, '').toLowerCase();
        const spouse = byName.get(clean);
        if(spouse) sim.spouseId = spouse.id;
      }
    }
    sim.spouseId = sim.spouseId || '';
  });
  parsed.relationsMigrated = true;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.sims)){
        parsed.libraries = parsed.libraries || { traits:[], aspirations:[], lifestyles:[], nationalities:[], families:[], lastNames:[] };
        parsed.historicalEvents = Array.isArray(parsed.historicalEvents) ? parsed.historicalEvents : [];
        parsed.sims.forEach(sim => {
          sim.traits = sim.traits || [];
          sim.aspirations = sim.aspirations || [];
          sim.lifestyles = sim.lifestyles || [];
          sim.aspirationCompleted = sim.aspirationCompleted || {};
        });
        migrateRelations(parsed);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); }catch(e){}
        return parsed;
      }
    }
  }catch(e){}
  return buildDefaultState();
}

function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  render();
}

function showToast(message){
  const existing = document.getElementById('toast-note');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'toast-note';
  el.className = 'toast-note';
  el.textContent = message;
  document.body.appendChild(el);
  (window.requestAnimationFrame || (cb => setTimeout(cb, 16)))(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

/* ---------------------------------------------------------
   GAME LOGIC
--------------------------------------------------------- */
function weekdayFor(day){
  const idx = (((day - 1) % 7) + 7) % 7;
  return WEEKDAYS[idx];
}

function yearForDay(day){ return 1300 + Math.floor((day - 1) / 4); }
function firstDayOfYear(year){ return ((year - 1300) * 4) + 1; }
function dayLabel(day){ return `Day ${day} · ${yearForDay(day)}`; }
function goToDay(day){ selectedDay = day; view = 'calendar'; calendarMode = 'day'; }

function stageFor(birthDay, currentDay, offsets){
  const age = currentDay - birthDay;
  if(age < 0) return 'Not yet born';
  if(age < offsets.infant) return 'Baby';
  if(age < offsets.toddler) return 'Infant';
  if(age < offsets.child) return 'Toddler';
  if(age < offsets.teen) return 'Child';
  if(age < offsets.youngAdult) return 'Teen';
  if(age < offsets.adult) return 'Young Adult';
  if(age < offsets.elder) return 'Adult';
  return 'Elder';
}

function ageDisplay(birthDay, currentDay){
  const days = currentDay - birthDay;
  if(days < 0) return '—';
  const totalMonths = days * 3;
  const years = Math.floor(totalMonths / 12);
  const months = totalMonths % 12;
  if(years === 0) return `${months} mo`;
  if(months === 0) return `${years}y`;
  return `${years}y ${months}mo`;
}

function getExpirationDay(sim, offsets){
  return sim.birthDay + (offsets.elder || 200) + 30;
}

function nextTransition(sim, currentDay, offsets){
  if(sim.status === 'Deceased') return null;
  for(const key of STAGE_SEQUENCE){
    const transitionDay = sim.birthDay + offsets[key];
    if(transitionDay >= currentDay){
      return { day: transitionDay, label: STAGE_LABELS[key], key, category: 'birthdays' };
    }
  }
  return null;
}

function upcomingEvents(state){
  const byDay = {};
  state.sims.forEach(sim => {
    STAGE_SEQUENCE.forEach(key => {
      const day = sim.birthDay + state.offsets[key];
      if(day >= state.currentDay){
        if(!byDay[day]) byDay[day] = [];
        byDay[day].push({ text: `${sim.firstName} ${sim.lastName} — ${STAGE_LABELS[key]}`, category: 'birthdays', iconUrl: ICONS.birthdays });
      }
    });
    if(sim.status === 'Alive'){
      const expDay = getExpirationDay(sim, state.offsets);
      if(expDay >= state.currentDay){
        if(!byDay[expDay]) byDay[expDay] = [];
        byDay[expDay].push({ text: `${sim.firstName} ${sim.lastName} — Expiration Date`, category: 'expiration', iconUrl: ICONS.expiration });
      }
    }
  });
  (state.historicalEvents || []).forEach(ev => {
    const startDay = Number(ev.startDay ?? ev.day);
    const endDay = Number(ev.endDay ?? ev.day ?? startDay);
    const sub = ev.subcat || 'others';
    const catKey = `historical-${sub}`;
    for(let day = startDay; day <= endDay; day++){
      if(day >= state.currentDay){
        if(!byDay[day]) byDay[day] = [];
        byDay[day].push({ text: ev.text, category: catKey, iconUrl: ICONS[catKey] || ICONS['historical-others'], eventId: ev.id });
      }
    }
  });
  return Object.entries(byDay).map(([day, items]) => ({
    day: Number(day), items, sub: weekdayFor(Number(day)),
  })).sort((a,b) => a.day - b.day).slice(0, 8);
}

function allEventsByDay(state){
  const map = {};
  function add(day, text, category, iconUrl, simId){
    if(day < 1) return;
    if(!map[day]) map[day] = [];
    map[day].push({ text, category, iconUrl, simId });
  }
  state.sims.forEach(sim => {
    add(sim.birthDay, `${sim.firstName} ${sim.lastName} was born`, 'births', ICONS.births, sim.id);
    if(sim.status === 'Deceased' && sim.yearOfDeath){
      const deathYear = parseInt(sim.yearOfDeath, 10);
      if(!isNaN(deathYear) && deathYear >= 1300){
        add(firstDayOfYear(deathYear), `${sim.firstName} ${sim.lastName} died`, 'deaths', ICONS.deaths, sim.id);
      }
    }
    STAGE_SEQUENCE.forEach(key => {
      const day = sim.birthDay + state.offsets[key];
      add(day, `${sim.firstName} ${sim.lastName} — ${STAGE_LABELS[key]}`, 'birthdays', ICONS.birthdays, sim.id);
    });
    if(sim.status === 'Alive'){
      const expDay = getExpirationDay(sim, state.offsets);
      add(expDay, `${sim.firstName} ${sim.lastName} — Expiration Date`, 'expiration', ICONS.expiration, sim.id);
    }
  });
  (state.historicalEvents || []).forEach(event => {
    const sub = event.subcat || 'others';
    const catKey = `historical-${sub}`;
    const startDay = Number(event.startDay ?? event.day);
    const endDay = Number(event.endDay ?? event.day ?? startDay);
    for(let day = startDay; day <= endDay; day++){
      add(day, event.text, catKey, ICONS[catKey] || ICONS['historical-others'], null, event.id);
    }
  });
  return map;
}

function eventMarkup(event){
  const text = typeof event === 'string' ? event : event.text;
  const eventId = typeof event === 'string' ? null : event.eventId;
  let output = text;
  state.sims.forEach(sim => {
    const name = `${sim.firstName} ${sim.lastName}`;
    output = output.replaceAll(name, `<a class="sim-link" data-sim-link="${sim.id}">${name}</a>`);
  });
  if(eventId){
    output += ` <button class="event-delete-btn" data-delete-history="${eventId}" title="Delete event">×</button>`;
  }
  return output;
}

function familyTreeGenerations(sims){
  const byId = new Map(sims.map(sim => [sim.id, sim]));
  const depth = new Map();
  const getDepth = (sim, trail = new Set()) => {
    if(depth.has(sim.id)) return depth.get(sim.id);
    if(trail.has(sim.id)) return 0;
    const parents = (sim.parentIds || []).map(id => byId.get(id)).filter(Boolean);
    const value = parents.length ? Math.max(...parents.map(parent => getDepth(parent, new Set([...trail, sim.id])))) + 1 : 0;
    depth.set(sim.id, value);
    return value;
  };
  sims.forEach(sim => getDepth(sim));
  return [...depth.entries()].reduce((groups, [id, level]) => {
    if(!groups[level]) groups[level] = [];
    groups[level].push(sims.find(sim => sim.id === id));
    return groups;
  }, []).filter(Boolean);
}

function renderFamilyTree(sims){
  const generations = familyTreeGenerations(sims);
  if(!generations.length) return '<div class="calendar-empty">Add sims to begin the family tree.</div>';
  const byId = new Map(sims.map(s => [s.id, s]));

  function nodeHtml(sim){
    const portrait = sim.photo
      ? `<img class="tree-node-portrait" src="${sim.photo}" alt="${sim.firstName}">`
      : `<div class="tree-node-portrait-empty">${sim.firstName[0]}${sim.lastName[0]}</div>`;
    return `<div class="tree-node" data-sim="${sim.id}" title="Open ${sim.firstName} ${sim.lastName}">
      ${portrait}
      <div class="tree-node-body">
        <div class="tree-node-name"><span class="status-dot ${sim.status==='Alive'?'alive':'deceased'}"></span>${sim.firstName} ${sim.lastName}</div>
        <div class="tree-node-meta">${sim.generation || 'Family member'} · ${sim.yearBorn || yearForDay(sim.birthDay)}</div>
      </div>
    </div>`;
  }

  function genRow(generation, genIndex){
    const placed = new Set();
    const groups = [];
    generation.forEach(sim => {
      if(placed.has(sim.id)) return;
      const spouse = sim.spouseId ? generation.find(s => s.id === sim.spouseId) : null;
      if(spouse && !placed.has(spouse.id)){
        groups.push({ type:'couple', ids:[sim.id, spouse.id] });
        placed.add(sim.id); placed.add(spouse.id);
      } else {
        groups.push({ type:'lone', ids:[sim.id] });
        placed.add(sim.id);
      }
    });
    const allLater = generations.slice(genIndex + 1).flat();
    groups.forEach(g => {
      g.children = allLater.filter(child =>
        (child.parentIds || []).some(pid => g.ids.includes(pid))
      ).sort((a,b) => a.birthDay - b.birthDay);
    });
    return groups;
  }

  function unitHtml(group){
    const pairHtml = group.type === 'couple'
      ? `<div class="tree-pair">
          ${nodeHtml(byId.get(group.ids[0]))}
          <div class="tree-marriage-bar"></div>
          ${nodeHtml(byId.get(group.ids[1]))}
        </div>`
      : nodeHtml(byId.get(group.ids[0]));
    if(!group.children.length) return `<div class="tree-unit">${pairHtml}</div>`;
    const stemH = 28;
    const childrenHtml = group.children.map(child => `
      <div class="tree-child-unit">
        <div class="tree-child-drop"></div>
        ${nodeHtml(child)}
      </div>`).join('');
    return `<div class="tree-unit">
      ${pairHtml}
      <div class="tree-drop-stem" style="height:${stemH}px"></div>
      <div class="tree-child-bar-wrap">
        <div class="tree-child-h-bar"></div>
        <div class="tree-children-row">${childrenHtml}</div>
      </div>
    </div>`;
  }

  const isChild = new Set();
  generations.forEach((gen, gi) => {
    const groups = genRow(gen, gi);
    groups.forEach(g => g.children.forEach(c => isChild.add(c.id)));
  });

  const rootGroups = [];
  generations.forEach((gen, gi) => {
    const groups = genRow(gen, gi);
    groups.forEach(g => {
      const anyIsRoot = g.ids.some(id => !isChild.has(id));
      if(anyIsRoot) rootGroups.push({ group: g, genIndex: gi });
    });
  });

  const genLabel = gi => gi === 0 ? 'Founding Generation' : `Generation ${gi + 1}`;
  const rowsHtml = rootGroups.map(({ group, genIndex }) =>
    `<div style="display:flex;flex-direction:column;align-items:center;">
      <div class="tree-gen-header"><span class="tree-gen-label">${genLabel(genIndex)}</span></div>
      <div style="height:16px;width:2px;background:var(--gold);opacity:.4;"></div>
      ${unitHtml(group)}
    </div>`
  ).join('<div style="width:48px;"></div>');
  return `<div class="family-tree"><div class="tree-gen-row">${rowsHtml}</div></div>`;
}

function computeRelationLines(sim, sims){
  const byId = new Map(sims.map(s => [s.id, s]));
  const lines = [];
  const parents = (sim.parentIds || []).map(id => byId.get(id)).filter(Boolean);
  if(parents.length){
    const label = sim.sex === 'M' ? 'Son of' : sim.sex === 'F' ? 'Daughter of' : 'Child of';
    lines.push(`${label} ${parents.map(p => `${p.firstName} ${p.lastName}`).join(' & ')}`);
  }
  if(sim.spouseId && byId.get(sim.spouseId)){
    const spouse = byId.get(sim.spouseId);
    lines.push(`Married to ${spouse.firstName} ${spouse.lastName}`);
  }
  if((sim.parentIds || []).length){
    const siblings = sims.filter(other => other.id !== sim.id && (other.parentIds || []).some(id => sim.parentIds.includes(id)));
    if(siblings.length){
      const label = sim.sex === 'M' ? 'Brother of' : sim.sex === 'F' ? 'Sister of' : 'Sibling of';
      lines.push(`${label} ${siblings.map(s => `${s.firstName} ${s.lastName}`).join(', ')}`);
    }
  }
  const children = sims.filter(other => (other.parentIds || []).includes(sim.id));
  if(children.length){
    const label = sim.sex === 'M' ? 'Father of' : sim.sex === 'F' ? 'Mother of' : 'Parent of';
    lines.push(`${label} ${children.map(c => `${c.firstName} ${c.lastName}`).join(', ')}`);
  }
  return lines;
}

function computeRelationRows(sim, sims){
  // Returns structured rows for the relations table: { role, name, id, yearLabel }
  const byId = new Map(sims.map(s => [s.id, s]));
  const rows = [];

  // Parents
  (sim.parentIds || []).map(id => byId.get(id)).filter(Boolean).forEach(p => {
    const role = p.sex === 'F' ? 'Mother' : p.sex === 'M' ? 'Father' : 'Parent';
    const yearLabel = p.yearBorn ? `Born ${p.yearBorn}` : '';
    rows.push({ role, roleOf: 'parent', name: `${p.firstName} ${p.lastName}`, id: p.id, yearLabel });
  });

  // Spouse(s)
  if(sim.spouseId && byId.get(sim.spouseId)){
    const sp = byId.get(sim.spouseId);
    const yearLabel = sim.yearMarried ? `Married ${sim.yearMarried}` : '';
    rows.push({ role: 'Spouse', roleOf: 'spouse', name: `${sp.firstName} ${sp.lastName}`, id: sp.id, yearLabel });
  }

  // Siblings
  if((sim.parentIds || []).length){
    sims.filter(other => other.id !== sim.id && (other.parentIds || []).some(id => (sim.parentIds || []).includes(id))).forEach(sib => {
      const role = sib.sex === 'M' ? 'Brother' : sib.sex === 'F' ? 'Sister' : 'Sibling';
      const yearLabel = sib.yearBorn ? `Born ${sib.yearBorn}` : '';
      rows.push({ role, roleOf: 'sibling', name: `${sib.firstName} ${sib.lastName}`, id: sib.id, yearLabel });
    });
  }

  // Children
  sims.filter(other => (other.parentIds || []).includes(sim.id)).forEach(child => {
    const role = child.sex === 'M' ? 'Son' : child.sex === 'F' ? 'Daughter' : 'Child';
    const yearLabel = child.yearBorn ? `Born ${child.yearBorn}` : '';
    rows.push({ role, roleOf: 'child', name: `${child.firstName} ${child.lastName}`, id: child.id, yearLabel });
  });

  return rows;
}

function sameParents(a, b){
  const pa = (a.parentIds || []).slice().sort();
  const pb = (b.parentIds || []).slice().sort();
  if(!pa.length || pa.length !== pb.length) return false;
  return pa.every((id, i) => id === pb[i]);
}

function twinLabel(sim){
  const twins = state.sims.filter(other => other.id !== sim.id && other.birthDay === sim.birthDay && sameParents(other, sim));
  return twins.length ? 'Twin' : '';
}

function simOptionsHtml(excludeId, selectedId){
  const options = state.sims.filter(s => s.id !== excludeId).sort((a,b) => (a.firstName+a.lastName).localeCompare(b.firstName+b.lastName));
  return `<option value="">—</option>` + options.map(s => `<option value="${s.id}" ${s.id===selectedId?'selected':''}>${s.firstName} ${s.lastName}</option>`).join('');
}

function addLibraryValue(sim, key, rawValue){
  const value = (rawValue || '').trim();
  if(!value) return;
  if(!sim[key].includes(value)) sim[key].push(value);
  const libraries = state.libraries || (state.libraries = { traits:[], aspirations:[], lifestyles:[] });
  if(!libraries[key].includes(value)) libraries[key].push(value);
  if(key === 'aspirations' && sim.aspirationCompleted[value] === undefined) sim.aspirationCompleted[value] = false;
}

function removeLibraryValue(sim, key, value){
  sim[key] = sim[key].filter(v => v !== value);
  if(key === 'aspirations') delete sim.aspirationCompleted[value];
}

/* ---------------------------------------------------------
   RENDER: SHELL
--------------------------------------------------------- */
function render(){
  const app = document.getElementById('app');
  const prevMain = document.querySelector('main');
  const prevModalEl = document.querySelector('.modal');
  const mainScroll = prevMain ? prevMain.scrollTop : 0;
  const modalScroll = prevModalEl ? prevModalEl.scrollTop : 0;
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  app.innerHTML = `
    <div class="spine">
      <div class="spine-title">
        <span class="eyebrow">Ultimate Decades Challenge</span>

  `;

}

document.addEventListener('input', (e) => {
  if (!e.target.classList.contains('tal-select-input')) return;
  if (e.target.id.indexOf('parent') !== -1) return;
  
  const input = e.target;
  const key = input.id.replace('tag-input-', '');
  const dropdown = document.getElementById(`tal-dropdown-${key}`);
  if (!dropdown) return;

  const query = input.value.toLowerCase().trim();
  const options = dropdown.querySelectorAll('.tal-option');

  options.forEach(opt => {
    // Extract the text of the option cleanly
    const textSpan = opt.querySelector('span');
    const text = textSpan ? textSpan.textContent.replace('added', '').trim().toLowerCase() : '';
    
    // STRICTLY matches if the item starts with what you typed
    if (text.startsWith(query)) {
      opt.style.display = 'flex';
    } else {
      opt.style.display = 'none';
    }
  });
});

function getIneligibleSpouses(sim) {
  const byId = new Map(state.sims.map(s => [s.id, s]));
  const excluded = new Set();
  excluded.add(sim.id);

  // Anyone already married
  state.sims.forEach(s => { if(s.spouseId && s.id !== sim.id) excluded.add(s.id); });

  // Parents
  (sim.parentIds || []).forEach(id => excluded.add(id));

  // Children
  state.sims.filter(s => (s.parentIds || []).includes(sim.id)).forEach(s => excluded.add(s.id));

  // Siblings (share at least one parent)
  if((sim.parentIds || []).length) {
    state.sims.filter(s => s.id !== sim.id && (s.parentIds || []).some(pid => (sim.parentIds || []).includes(pid))).forEach(s => excluded.add(s.id));
  }

  // Grandparents
  (sim.parentIds || []).forEach(pid => {
    const parent = byId.get(pid);
    if(parent) (parent.parentIds || []).forEach(gpid => excluded.add(gpid));
  });

  // Grandchildren
  state.sims.filter(s => (s.parentIds || []).includes(sim.id)).forEach(child => {
    state.sims.filter(s => (s.parentIds || []).includes(child.id)).forEach(gc => excluded.add(gc.id));
  });

  // Aunts/uncles (siblings of parents)
  (sim.parentIds || []).forEach(pid => {
    const parent = byId.get(pid);
    if(parent && (parent.parentIds || []).length) {
      state.sims.filter(s => s.id !== pid && (s.parentIds || []).some(gpid => (parent.parentIds || []).includes(gpid))).forEach(s => excluded.add(s.id));
    }
  });

  // Nieces/nephews (children of siblings)
  if((sim.parentIds || []).length) {
    state.sims.filter(s => s.id !== sim.id && (s.parentIds || []).some(pid => (sim.parentIds || []).includes(pid))).forEach(sib => {
      state.sims.filter(s => (s.parentIds || []).includes(sib.id)).forEach(s => excluded.add(s.id));
    });
  }

  return excluded;
}

function getIneligibleChildren(sim) {
  const byId = new Map(state.sims.map(s => [s.id, s]));
  const excluded = new Set();
  excluded.add(sim.id);

  // Parents of sim (can't be their own grandparent's child)
  (sim.parentIds || []).forEach(id => excluded.add(id));

  // Spouse
  if(sim.spouseId) excluded.add(sim.spouseId);

  // Siblings
  if((sim.parentIds || []).length) {
    state.sims.filter(s => s.id !== sim.id && (s.parentIds || []).some(pid => (sim.parentIds || []).includes(pid))).forEach(s => excluded.add(s.id));
  }

  // Grandparents
  (sim.parentIds || []).forEach(pid => {
    const parent = byId.get(pid);
    if(parent) (parent.parentIds || []).forEach(gpid => excluded.add(gpid));
  });

  // Aunts/uncles
  (sim.parentIds || []).forEach(pid => {
    const parent = byId.get(pid);
    if(parent && (parent.parentIds || []).length) {
      state.sims.filter(s => s.id !== pid && (s.parentIds || []).some(gpid => (parent.parentIds || []).includes(gpid))).forEach(s => excluded.add(s.id));
    }
  });

  // Already-linked children (no duplicates)
  state.sims.filter(s => (s.parentIds || []).includes(sim.id)).forEach(s => excluded.add(s.id));

  return excluded;
}

function getIneligibleParents(sim) {
  const excluded = new Set();
  excluded.add(sim.id);

  // Already-assigned parents
  (sim.parentIds || []).forEach(id => excluded.add(id));

  // Sim's own children
  state.sims.filter(s => (s.parentIds || []).includes(sim.id)).forEach(s => excluded.add(s.id));

  // Spouse
  if(sim.spouseId) excluded.add(sim.spouseId);

  // Siblings
  if((sim.parentIds || []).length) {
    state.sims.filter(s => s.id !== sim.id && (s.parentIds || []).some(pid => (sim.parentIds || []).includes(pid))).forEach(s => excluded.add(s.id));
  }

  return excluded;
}

            <label class="filter-dropdown-item"><input type="checkbox" data-filter-val="births" ${catAll||calendarCategory.includes('births')?'checked':''}> Births</label>
            <label class="filter-dropdown-item"><input type="checkbox" data-filter-val="deaths" ${catAll||calendarCategory.includes('deaths')?'checked':''}> Deaths</label>
            <label class="filter-dropdown-item"><input type="checkbox" data-filter-val="expiration" ${catAll||calendarCategory.includes('expiration')?'checked':''}> Expiration Dates</label>
            <label class="filter-dropdown-item"><input type="checkbox" data-filter-val="historical-wars" ${catAll||calendarCategory.includes('historical-wars')?'checked':''}> Wars</label>
            <label class="filter-dropdown-item"><input type="checkbox" data-filter-val="historical-outbreaks" ${catAll||calendarCategory.includes('historical-outbreaks')?'checked':''}> Outbreaks</label>

        ${(calendarMode === 'decade' || calendarMode === 'all') ? `<input type="number" id="jump-to-year" class="calendar-search-input" placeholder="Jump to year…" style="width:130px" min="1300" max="2030">` : ''}

  if(calendarMode === 'day'){

          </div>
        </div>
      ${contentEnd}
      <div class="card card-pad">
        <div class="section-title"><span>Journal entry</span><button class="btn small" data-action="day-journal">${note ? 'Edit entry' : 'Add journal entry'}</button></div>
        ${note ? `<p class="rules-copy">${note}</p>` : '<div class="empty-journal">No journal entry for this day yet.</div>'}
      </div>`;
  }

    if(calendarMode === 'year'){
    const days = yearDays(calendarYear);
    const hasActiveSearch = query || !catAll;
    return `${pageHead}${calendarHeader}${contentStart}
        <div class="year-grid-large">${days.map(day => {
          const evs = filteredEvents(day);
          if(hasActiveSearch && !evs.length) return '';
          return `<div class="year-day-large ${day===state.currentDay?'current':''}" data-calendar-day="${day}">
            <span class="day-label">Day ${day}</span><span class="day-week">${weekdayFor(day)}</span>
            ${evs.length ? evs.map(event => `<div class="event-line"><button class="event-icon-btn" data-filter-cat="${event.category}"><img src="${event.iconUrl}" alt="icon"></button>${eventMarkup(event)}</div>`).join('') : `<div class="calendar-empty" style="margin-top:8px;font-size:12px;">No scheduled events</div>`}
          </div>`;
        }).join('') || '<div class="calendar-empty">No days match that filter.</div>'}</div>
      ${contentEnd}`;
  }

  if(calendarMode === 'decade'){
    const years = Array.from({length:10}, (_, index) => calendarDecade + index);
    const visibleYears = years.filter(year => {
      const days = yearDays(year);
      const yearEvents = days.flatMap(day => filteredEvents(day));
      if(!query) return catAll || yearEvents.length;
      return String(year).includes(query) || yearEvents.some(event => event.text.toLowerCase().includes(query));
    });
    return `${pageHead}${calendarHeader}${contentStart}
        <div class="year-grid-large">${visibleYears.map(year => {
          const days = yearDays(year);
          const yearEvents = days.flatMap(day => filteredEvents(day));
          const previews = yearEvents.slice(0,4).map(event => {
            const day = days.find(d => (events[d] || []).includes(event));
            const iconHtml = event.iconUrl ? `<img src="${event.iconUrl}" alt="" style="width:12px;height:12px;object-fit:contain;vertical-align:middle;opacity:.82;margin:0 4px 1px 0;">` : '';

    const days = yearDays(year);
    return days.some(day => {
      if(!showPast && day < state.currentDay) return false;
      const dayEvs = (allEvents[day] || []).filter(ev => catAllTimeline || calendarCategory.includes(ev.category));
      if(!query) return dayEvs.length > 0;
      return dayEvs.some(ev => ev.text.toLowerCase().includes(query)) || String(year).includes(query);
    });
  };
  const iconsForYear = year => {
    const days = yearDays(year);
    const seen = new Set();
    const icons = [];
    days.forEach(day => {
      if(!showPast && day < state.currentDay) return;
      (allEvents[day] || []).forEach(ev => {
        if((catAllTimeline || calendarCategory.includes(ev.category)) && ev.iconUrl && !seen.has(ev.iconUrl)){
          seen.add(ev.iconUrl);
          icons.push(ev.iconUrl);
        }
      });
    });
    return icons;
  };
  const START_YEAR = 1300;
  const END_YEAR = 2030;
  const centuries = [];
  for(let c = Math.floor(START_YEAR / 100) * 100; c <= END_YEAR; c += 100) centuries.push(c);
  const currentYear = yearForDay(state.currentDay);
  const centuryBlocks = centuries.map(centuryStart => {
    const centuryEnd = Math.min(centuryStart + 99, END_YEAR);
    const rows = [];
    for(let rowStart = centuryStart; rowStart <= centuryEnd; rowStart += 10){
      const rowYears = [];
      for(let y = rowStart; y < rowStart + 10 && y <= centuryEnd; y++) rowYears.push(y);
      rows.push(rowYears);
    }
    const rowsHtml = rows.map(rowYears => {
              const hasActiveSearch = query || hasActiveFilter;
        const cells = rowYears.map(year => {
          const startDay = firstDayOfYear(year);
          const endDay = startDay + 3;
          const hasEvents = yearHasEvents(year);
          if(hasActiveSearch && !hasEvents) return '';
          const icons = iconsForYear(year);
          const isCurrent = year === currentYear;
          const iconsHtml = icons.length ? `<div class="yc-icons">${icons.map(url => `<img src="${url}" alt="">`).join('')}</div>` : '';
          return `<div class="year-cell${isCurrent ? ' current-year' : ''}${hasEvents ? ' has-events' : ''}" data-calendar-year="${year}" title="${year} · Days ${startDay}–${endDay}">
            <span class="yc-year">${year}</span>
            <span class="yc-days">${startDay}–${endDay}</span>
            ${iconsHtml}
          </div>`;
        }).join('');
      return `<div class="year-row">${cells}</div>`;
    }).join('');
    return `<div class="century-block"><div class="century-heading">${centuryStart}s</div>${rowsHtml}</div>`;
  }).join('');
  return `${pageHead}${calendarHeader}${contentStart}${centuryBlocks || '<div class="calendar-empty">No calendar data available.</div>'}${contentEnd}`;
}

function renderRosterTable(sims){
  const cols = [
    { key:'name',      label:'Name' },
    { key:'generation',label:'Gen' },
    { key:'sex',       label:'Sex' },
    { key:'birthDay',  label:'Day born' },
    { key:'yearBorn',  label:'Year born' },
    { key:'age',       label:'Age' },
    { key:'stage',     label:'Life stage' },
    { key:'status',    label:'Status' },
  ];
  const arrow = col => {
    if(rosterSortCol !== col.key) return `<span style=";margin-left:4px;color:rgba(33,40,31,.6);">↕</span>`;
    return `<span style="margin-left:4px;color:var(--wax);">${rosterSortDir === 1 ? '↑' : '↓'}</span>`;
  };
  const getValue = (s, key) => {
    if(key === 'name')       return (s.firstName + ' ' + s.lastName).toLowerCase();
    if(key === 'generation') return s.generation || '';
    if(key === 'sex')        return s.sex || '';
    if(key === 'birthDay')   return s.birthDay;
    if(key === 'yearBorn')   return parseInt(s.yearBorn, 10) || 0;
    if(key === 'age')        return s.birthDay; // proxy for age (same ordering)
    if(key === 'stage')      return stageFor(s.birthDay, state.currentDay, state.offsets);
    if(key === 'status')     return s.status || '';
    return '';
  };
  const sorted = [...sims].sort((a, b) => {
    const va = getValue(a, rosterSortCol);
    const vb = getValue(b, rosterSortCol);
    if(typeof va === 'number' && typeof vb === 'number') return (va - vb) * rosterSortDir;
    return String(va).localeCompare(String(vb)) * rosterSortDir;
  });
  const thStyle = 'cursor:pointer;user-select:none;white-space:nowrap;';
  return `<table class="roster">
    <thead><tr>${cols.map(col =>
      `<th style="${thStyle}" data-roster-sort="${col.key}">${col.label}${arrow(col)}</th>`
    ).join('')}</tr></thead>
    <tbody>
      ${sorted.map(s => {
        const stage = s.status === 'Deceased' ? '—' : stageFor(s.birthDay, state.currentDay, state.offsets);
        return `<tr data-sim="${s.id}">
          <td class="sim-name">${s.photo ? `<img class="roster-portrait" src="${s.photo}" alt="">` : '<span class="roster-portrait roster-portrait-empty"></span>'}${s.firstName} ${s.lastName}</td>
          <td>${s.generation||'—'}</td>
          <td>${s.sex||'—'}</td>
          <td>${s.birthDay}</td>
          <td>${s.yearBorn || '—'}</td>
          <td>${ageDisplay(s.birthDay, state.currentDay)}</td>
          <td>${stage}</td>
          <td><span class="status-dot ${s.status==='Alive'?'alive':'deceased'}"></span>${s.status}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

function renderRoster(){
  const alive = state.sims.filter(s => s.status === 'Alive').length;
  const deceased = state.sims.filter(s => s.status === 'Deceased').length;
  const stageCounts = {};
  state.sims.filter(s=>s.status==='Alive').forEach(s => {
    const st = stageFor(s.birthDay, state.currentDay, state.offsets);
    stageCounts[st] = (stageCounts[st]||0) + 1;
  });
  const filtered = state.sims.filter(s => {
    const q = rosterSearch.toLowerCase();
    if(!q) return true;
    const relationText = computeRelationLines(s, state.sims).join(' ');
    return (s.firstName+' '+s.lastName+' '+s.generation+' '+relationText).toLowerCase().includes(q);
  }).sort((a,b) => a.birthDay - b.birthDay);
  return `
    <div class="page-head"><span class="eyebrow">Your bloodline</span><h2>Family Tree</h2><p>Browse every sim as a family tree or return to the full list, with each profile retaining its complete record.</p></div>
    <div class="card card-pad">
      <div class="roster-stats">
        <div class="stat"><div class="num">${state.sims.length}</div><div class="lbl">TOTAL</div></div>
        <div class="stat"><div class="num">${alive}</div><div class="lbl">ALIVE</div></div>
        <div class="stat dead"><div class="num">${deceased}</div><div class="lbl">DECEASED</div></div>
        ${Object.entries(stageCounts).map(([k,v]) => `<div class="stat"><div class="num">${v}</div><div class="lbl">${k.toUpperCase()}</div></div>`).join('')}
      </div>
    </div>
    <div class="card card-pad">
      <div class="roster-toolbar">
        <div class="roster-view-btns">
          <button class="btn small ${rosterView==='list'?'selected':''}" data-roster-view="list">List</button>
          <button class="btn small ${rosterView==='tree'?'selected':''}" data-roster-view="tree">Family tree</button>

        <input type="search" id="roster-search" placeholder="Search name or generation…" value="${rosterSearch}">
        <div class="roster-spacer"></div>
        <button class="btn red" data-action="new-sim">+ Add sim</button>
      </div>
      ${rosterView === 'tree' ? renderFamilyTree(filtered) : renderRosterTable(filtered)}
    </div>`;
}

function saveSimInfoFields(sim){
  if(document.getElementById('sim-firstName')) sim.firstName = document.getElementById('sim-firstName').value.trim();
  // lastName handled by TAL field — value already written to sim on pick/enter; also read input directly as fallback
  const lastNameInput = document.getElementById('sim-lastName');
  if(lastNameInput) sim.lastName = lastNameInput.value.trim() || sim.lastName;
  const statusEl = document.getElementById('sim-status');
  if(statusEl) sim.status = statusEl.value;
  const natInput = document.getElementById('sim-nationality');
  const famInput = document.getElementById('sim-family');
  if(natInput) sim.nationality = natInput.value.trim();
  if(famInput) sim.family = famInput.value.trim();
  const genInput = document.getElementById('sim-generation');
  if(genInput) sim.generation = genInput.value.trim();
  const sexInput = document.getElementById('sim-sex');
  if(sexInput) sim.sex = sexInput.value;
  if(sim.status === 'Deceased'){
    const yd = document.getElementById('sim-yearOfDeath');
    const cd = document.getElementById('sim-causeOfDeath');
    if(yd) sim.yearOfDeath = yd.value.trim();
    if(cd) sim.causeOfDeath = cd.value.trim();
  } else {
    sim.yearOfDeath = '';
    sim.causeOfDeath = '';
  }
  if(document.getElementById('sim-parent1-id')){
    const parent1 = document.getElementById('sim-parent1-id').value;
    const parent2 = document.getElementById('sim-parent2-id').value;
    sim.parentIds = [parent1, parent2].filter(Boolean);
  }
  const notesEl = document.getElementById('sim-notes');
  if(notesEl) sim.notes = notesEl.value;
  simEditMode = false;
  persist();
  showToast('Sim saved');
}
