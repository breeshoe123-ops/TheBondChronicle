  let dragging = false;

  let marqueeBox = wrap.querySelector('.crop-container-box');
  if(!marqueeBox) {
    marqueeBox = document.createElement('div');
    marqueeBox.className = 'crop-container-box';
    marqueeBox.style.position = 'absolute';
    marqueeBox.style.pointerEvents = 'none';

    const inner = document.createElement('div');
    inner.className = 'crop-marquee-inner';
    marqueeBox.appendChild(inner);

    ['tl', 'tr', 'bl', 'br'].forEach(pos => {
      const h = document.createElement('div');
      h.className = `crop-handle handle-${pos}`;
      if(pos === 'tl') { h.style.top = '-4px'; h.style.left = '-4px'; }
      if(pos === 'tr') { h.style.top = '-4px'; h.style.right = '-4px'; }
      if(pos === 'bl') { h.style.bottom = '-4px'; h.style.left = '-4px'; }
      if(pos === 'br') { h.style.bottom = '-4px'; h.style.right = '-4px'; }
      marqueeBox.appendChild(h);
    });

    wrap.style.position = 'relative';
    wrap.appendChild(marqueeBox);
  }

  function canvasToDisplay(canvasVal) {
    const rect = wrap.getBoundingClientRect();
    return canvasVal * (rect.width / SIZE);
  }

  function updateMarqueeUI() {
    if (!selection) {
      marqueeBox.style.display = 'none';
      return;
    }
    marqueeBox.style.display = 'block';
    marqueeBox.style.left   = canvasToDisplay(selection.x)    + 'px';
    marqueeBox.style.top    = canvasToDisplay(selection.y)    + 'px';
    marqueeBox.style.width  = canvasToDisplay(selection.size) + 'px';
    marqueeBox.style.height = canvasToDisplay(selection.size) + 'px';
  }

  function draw(){
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--paper-light').trim() || '#F7F0DC';
    ctx.fillRect(0, 0, SIZE, SIZE);
    const w = img.naturalWidth * imgScale;
    const h = img.naturalHeight * imgScale;
    ctx.drawImage(img, imgX, imgY, w, h);
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.lineWidth = 1;                    
    ctx.strokeRect(imgX, imgY, w, h);
    updateMarqueeUI();
  }

  img.crossOrigin = 'anonymous';
  img.onload = () => {
    imgScale = Math.min(SIZE / img.naturalWidth, SIZE / img.naturalHeight);
    const w = img.naturalWidth * imgScale;
    const h = img.naturalHeight * imgScale;
    imgX = (SIZE - w) / 2;
    imgY = (SIZE - h) / 2;
    imgBounds = { x: imgX, y: imgY, w, h };
    selection = null;
    draw();
  };

  if(zoomInput) zoomInput.parentElement.style.display = 'none';

  function getCanvasCoords(e) {
    const rect = wrap.getBoundingClientRect();
    const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    const scaleX = SIZE / rect.width;
    const scaleY = SIZE / rect.height;
    const cx = (clientX - rect.left) * scaleX;
    const cy = (clientY - rect.top)  * scaleY;
    return {
      x: Math.max(imgBounds.x, Math.min(imgBounds.x + imgBounds.w, cx)),
      y: Math.max(imgBounds.y, Math.min(imgBounds.y + imgBounds.h, cy)),
      rawX: cx,
      rawY: cy
    };
  }

  function checkHitType(pos) {
    if (!selection) return 'create';
    const tol = 25 * (wrap.getBoundingClientRect().width / SIZE);
    const brX = selection.x + selection.size;
    const brY = selection.y + selection.size;
    const nearBR = Math.abs(pos.x - brX) < tol && Math.abs(pos.y - brY) < tol;
    const nearTL = Math.abs(pos.x - selection.x) < tol && Math.abs(pos.y - selection.y) < tol;
    const nearTR = Math.abs(pos.x - brX) < tol && Math.abs(pos.y - selection.y) < tol;
    const nearBL = Math.abs(pos.x - selection.x) < tol && Math.abs(pos.y - brY) < tol;

    if (nearBR || nearTL || nearTR || nearBL) return 'resize';
    if (pos.x >= selection.x && pos.x <= brX && pos.y >= selection.y && pos.y <= brY) return 'move';
    return 'cancel';
  }

  function clampToImage(x, y, size) {
    const maxX = imgBounds.x + imgBounds.w;
    const maxY = imgBounds.y + imgBounds.h;
    size = Math.min(size, maxX - x, maxY - y);
    x = Math.max(imgBounds.x, Math.min(maxX - size, x));
    y = Math.max(imgBounds.y, Math.min(maxY - size, y));
    size = Math.min(size, maxX - x, maxY - y);
    return { x, y, size: Math.max(0, size) };
  }

  function onDown(e) {
    if(e.button !== undefined && e.button !== 0) return;
    const pos = getCanvasCoords(e);
    
    // If clicking outside image bounds, do nothing
    if (pos.rawX < imgBounds.x || pos.rawX > imgBounds.x + imgBounds.w ||
        pos.rawY < imgBounds.y || pos.rawY > imgBounds.y + imgBounds.h) {
      return;
    }

    const hit = checkHitType(pos);

    if (hit === 'cancel') {
      selection = null;
      updateMarqueeUI();
      e.preventDefault();
      return;
    }

    dragging = true;
    mode = hit;
    startX = pos.x;
    startY = pos.y;
    initialSelection = selection ? { ...selection } : null;

    if (mode === 'create') {
      selection = { x: pos.x, y: pos.y, size: 0 };
    }
    e.preventDefault();
  }

  function onMove(e) {
    const pos = getCanvasCoords(e);
    const insideImg = pos.rawX >= imgBounds.x && pos.rawX <= imgBounds.x + imgBounds.w &&
                      pos.rawY >= imgBounds.y && pos.rawY <= imgBounds.y + imgBounds.h;

    if (!dragging) {
      if (!insideImg) {
        wrap.style.cursor = 'default';
        return;
      }
      if (!selection) {
        wrap.style.cursor = 'crosshair';
        return;
      }
      const hit = checkHitType(pos);
      if (hit === 'resize') {
        const tol = 25 * (wrap.getBoundingClientRect().width / SIZE);
        const brX = selection.x + selection.size;
        const brY = selection.y + selection.size;
        const nearTL = Math.abs(pos.x - selection.x) < tol && Math.abs(pos.y - selection.y) < tol;
        const nearTR = Math.abs(pos.x - brX) < tol && Math.abs(pos.y - selection.y) < tol;
        const nearBL = Math.abs(pos.x - selection.x) < tol && Math.abs(pos.y - brY) < tol;
        const nearBR = Math.abs(pos.x - brX) < tol && Math.abs(pos.y - brY) < tol;

        if (nearTL || nearBR) wrap.style.cursor = 'nwse-resize';
        else if (nearTR || nearBL) wrap.style.cursor = 'nesw-resize';
        else wrap.style.cursor = 'nwse-resize';
      } else if (hit === 'move') {
        wrap.style.cursor = 'move';
      } else {
        wrap.style.cursor = 'crosshair';
      }
      return;
    }

    if (mode === 'create') {
      const dx = pos.x - startX;
      const dy = pos.y - startY;
      const size = Math.max(Math.abs(dx), Math.abs(dy));
      const rawX = dx < 0 ? startX - size : startX;
      const rawY = dy < 0 ? startY - size : startY;
      selection = clampToImage(rawX, rawY, size);

    } else if (mode === 'resize') {
      const delta = Math.max(pos.x - startX, pos.y - startY);
      const newSize = Math.max(20, initialSelection.size + delta);
      selection = clampToImage(initialSelection.x, initialSelection.y, newSize);

    } else if (mode === 'move') {
      const dx = pos.x - startX;
      const dy = pos.y - startY;
      const size = initialSelection.size;
      const maxX = imgBounds.x + imgBounds.w;
      const maxY = imgBounds.y + imgBounds.h;

      let x = initialSelection.x + dx;
      let y = initialSelection.y + dy;

      x = Math.max(imgBounds.x, Math.min(maxX - size, x));
      y = Math.max(imgBounds.y, Math.min(maxY - size, y));

      selection = { x, y, size };
      wrap.style.cursor = 'move';
    }

    updateMarqueeUI();
    e.preventDefault();
  }

  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    mode = null;
    if (selection && selection.size < 20) {
      selection = null;
      updateMarqueeUI();
    }
  }

  function winMove(e) { onMove(e); }
  function winUp(e)   { onUp(e); }

  window.addEventListener('mousemove', winMove);
  window.addEventListener('mouseup',   winUp);
  window.addEventListener('touchmove', winMove, { passive: false });
  window.addEventListener('touchend',  winUp);

  wrap.addEventListener('mousedown',  onDown);
  wrap.addEventListener('touchstart', onDown, { passive: false });

  function teardown() {
    window.removeEventListener('mousemove', winMove);
    window.removeEventListener('mouseup',   winUp);
    window.removeEventListener('touchmove', winMove);
    window.removeEventListener('touchend',  winUp);
    wrap.removeEventListener('mousedown',  onDown);
    wrap.removeEventListener('touchstart', onDown);
  }

  const saveBtn = document.querySelector('[data-action="save-crop"]');
  if(saveBtn) saveBtn.onclick = () => {
    if (!selection || selection.size < 20) {
      alert('Please draw a crop selection first.');
      return;
    }
    const out = document.createElement('canvas');
    out.width = 400;
    out.height = 400;
    const octx = out.getContext('2d');
    octx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--paper-light').trim() || '#F7F0DC';
    octx.fillRect(0, 0, 400, 400);

    const sourceX = (selection.x - imgX) / imgScale;
    const sourceY = (selection.y - imgY) / imgScale;
    const sourceSize = selection.size / imgScale;

    octx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, 400, 400);

    sim.photo = out.toDataURL('image/jpeg', 0.92);
    if(marqueeBox) marqueeBox.remove();
    teardown();
    modal = 'sim-profile';
    cropSimId = null;
    persist();
  };
}

function bindSimInfoForm(sim){
  const photoInput = document.getElementById('sim-photo');
  if(photoInput) photoInput.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = event => { sim.photo = event.target.result; persist(); };
    reader.readAsDataURL(file);
  };
  const editBtn = document.querySelector('[data-action="edit-sim-info"]');
  if(editBtn) editBtn.onclick = () => { simEditMode = true; render(); };
  const cancelBtn = document.querySelector('[data-action="cancel-sim-info"]');
  if(cancelBtn) cancelBtn.onclick = () => { simEditMode = false; render(); };
  const saveBtn = document.querySelector('[data-action="save-sim-info"]');
  if(saveBtn) saveBtn.onclick = () => saveSimInfoFields(sim);
  const statusSelect = document.getElementById('sim-status');
  if(statusSelect) statusSelect.onchange = () => {
    const show = statusSelect.value === 'Deceased';
    document.querySelectorAll('.death-field').forEach(el => el.style.display = show ? 'block' : 'none');
  };
  // TAL select2 dropdown interactions
  ['traits','aspirations','lifestyles'].forEach(key => {
    const input = document.getElementById(`tag-input-${key}`);
    const panel = document.getElementById(`tal-dropdown-${key}`);
    const createRow = document.getElementById(`tal-create-${key}`);
    if(!input || !panel) return;

    const openPanel = () => panel.classList.add('open');
    const closePanel = () => { panel.classList.remove('open'); };

    const filterOptions = () => {
      const q = input.value.trim().toLowerCase();
      const opts = panel.querySelectorAll('.tal-option');
      let anyVisible = false;
      opts.forEach(opt => {
        const text = opt.dataset.talPick.split('::')[1];
        const match = !q || text.toLowerCase().includes(q);
        opt.style.display = match ? '' : 'none';
        if(match) anyVisible = true;
      });
      const emptyEl = panel.querySelector('.tal-empty');
      if(emptyEl) emptyEl.style.display = (!anyVisible) ? '' : 'none';
      if(createRow){
        const rawVal = input.value.trim();
        const alreadyInLib = (state.libraries[key]||[]).some(v => v.toLowerCase() === rawVal.toLowerCase());
        const alreadyAdded = (sim[key]||[]).some(v => v.toLowerCase() === rawVal.toLowerCase());
        if(rawVal && !alreadyInLib && !alreadyAdded){
          createRow.textContent = `+ Add "${rawVal}"`;
          createRow.dataset.talCreate = key;
          createRow.dataset.talCreateVal = rawVal;
          createRow.style.display = '';
        } else {
          createRow.style.display = 'none';
        }
      }
    };

    input.onfocus = () => { openPanel(); filterOptions(); };
    input.oninput = () => { filterOptions(); if(!panel.classList.contains('open')) openPanel(); };
    input.onkeydown = e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        const val = input.value.trim();
        if(!val) return;
        addLibraryValue(sim, key, val);
        input.value = '';
        persist();
      }
      if(e.key === 'Escape'){ closePanel(); input.blur(); }
    };

    // Click on saved suggestion option
    panel.querySelectorAll('.tal-option:not(.is-added)').forEach(opt => {
      opt.onmousedown = e => {
        if(e.target.closest('.tal-lib-remove')) return;
        e.preventDefault();
        const val = opt.dataset.talPick.split('::')[1];
        addLibraryValue(sim, key, val);
        input.value = '';
        closePanel();
        persist();
      };
    });

    // Click on X to remove a value from the library suggestions entirely
    panel.querySelectorAll('.tal-lib-remove').forEach(btn => {
      btn.onmousedown = e => {
        e.preventDefault();
        e.stopPropagation();
        const [libKey, val] = btn.dataset.talLibRemove.split('::');
        const libs = state.libraries || (state.libraries = { traits:[], aspirations:[], lifestyles:[] });
        libs[libKey] = (libs[libKey] || []).filter(v => v !== val);
        persist();
      };
    });

    // Click on create row
    if(createRow){
      createRow.onmousedown = e => {
        e.preventDefault();
        const val = createRow.dataset.talCreateVal;
        if(val){ addLibraryValue(sim, key, val); input.value = ''; closePanel(); persist(); }
      };
    }

    // Close panel on outside click — persistent listener, scoped to this key's wrap
    const talWrap = input.closest('.tal-select-wrap');
    const outsideHandler = e => {
      if(talWrap && !talWrap.contains(e.target)){
        closePanel();
      }
    };
    // Remove any previously attached handler for this key before adding a fresh one
    if(talWrap){
      const existingKey = `_talOutside_${key}`;
      if(talWrap[existingKey]) document.removeEventListener('mousedown', talWrap[existingKey]);
      talWrap[existingKey] = outsideHandler;
      document.addEventListener('mousedown', outsideHandler);
    }
  });
  // Single-value TAL fields (Last Name, Nationality, Family)
  ['sim-lastName::lastNames', 'sim-nationality::nationalities', 'sim-family::families'].forEach(pair => {
    const [inputId, libraryKey] = pair.split('::');
    const input = document.getElementById(inputId);
    const panel = document.getElementById(`tal-dropdown-${inputId}`);
    const createRow = document.getElementById(`tal-create-${inputId}`);
    if(!input || !panel) return;
    const openPanel = () => panel.classList.add('open');
    const closePanel = () => panel.classList.remove('open');
    const filterOptions = () => {
      const q = input.value.trim().toLowerCase();
      const opts = panel.querySelectorAll('.tal-option');
      let anyVisible = false;
      opts.forEach(opt => {
        const val = (opt.dataset.talSinglePick||'').split('::')[1]||'';
        const match = !q || val.toLowerCase().includes(q);
        opt.style.display = match ? '' : 'none';
        if(match) anyVisible = true;
      });
      const emptyEl = panel.querySelector('.tal-empty');
      if(emptyEl) emptyEl.style.display = (!anyVisible && !q) ? '' : 'none';
      if(createRow){
        const rawVal = input.value.trim();
        const alreadyInLib = (state.libraries[libraryKey]||[]).some(v => v.toLowerCase() === rawVal.toLowerCase());
        if(rawVal && !alreadyInLib){
          createRow.textContent = `+ Add "${rawVal}"`;
          createRow.dataset.talSingleCreateVal = rawVal;
          createRow.style.display = '';
        } else {
          createRow.style.display = 'none';
        }
      }
    };
    input.onfocus = () => { openPanel(); filterOptions(); };
    input.oninput = () => { filterOptions(); if(!panel.classList.contains('open')) openPanel(); };
    input.onkeydown = e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        const val = input.value.trim();
        if(!val) return;
        const libs = state.libraries || (state.libraries = {});
        if(!libs[libraryKey]) libs[libraryKey] = [];
        if(!libs[libraryKey].includes(val)) libs[libraryKey].push(val);
        // Save the typed value to the sim field so render() doesn't clobber it
        if(libraryKey === 'lastNames') sim.lastName = val;
        else if(libraryKey === 'nationalities') sim.nationality = val;
        else if(libraryKey === 'families') sim.family = val;
        closePanel();
        persist();
      }
      if(e.key === 'Escape'){ closePanel(); input.blur(); }
    };
    panel.querySelectorAll('[data-tal-single-pick]').forEach(opt => {
      opt.onmousedown = e => {
        if(e.target.closest('.tal-lib-remove')) return;
        e.preventDefault();
        const val = (opt.dataset.talSinglePick||'').split('::')[1]||'';
        input.value = val;
        // Save to sim so render() doesn't reset the field
        if(libraryKey === 'lastNames') sim.lastName = val;
        else if(libraryKey === 'nationalities') sim.nationality = val;
        else if(libraryKey === 'families') sim.family = val;
        closePanel();
      };
    });
    panel.querySelectorAll('.tal-lib-remove').forEach(btn => {
      btn.onmousedown = e => {
        e.preventDefault(); e.stopPropagation();
        const [lk, val] = btn.dataset.talLibRemove.split('::');
        const libs = state.libraries || {};
        if(libs[lk]) libs[lk] = libs[lk].filter(v => v !== val);
        persist();
      };
    });
    if(createRow){
      createRow.onmousedown = e => {
        e.preventDefault();
        const val = createRow.dataset.talSingleCreateVal;
        if(val){
          const libs = state.libraries || (state.libraries = {});
          if(!libs[libraryKey]) libs[libraryKey] = [];
          if(!libs[libraryKey].includes(val)) libs[libraryKey].push(val);
          input.value = val;
          // Save to sim so render() doesn't reset the field
          if(libraryKey === 'lastNames') sim.lastName = val;
          else if(libraryKey === 'nationalities') sim.nationality = val;
          else if(libraryKey === 'families') sim.family = val;
          closePanel();
          persist();
        }
      };
    }
    const talWrap = input.closest('.tal-select-wrap');
    if(talWrap){
      const handler = e => { if(!talWrap.contains(e.target)) closePanel(); };
      document.addEventListener('mousedown', handler);
    }
  });

  // Tag remove from sim
  document.querySelectorAll('[data-remove-tag]').forEach(btn => {
    btn.onclick = () => { const [key, value] = btn.dataset.removeTag.split('::'); removeLibraryValue(sim, key, value); persist(); };
  });
  // Aspiration completion
  document.querySelectorAll('[data-aspiration]').forEach(input => {
    input.onchange = () => { sim.aspirationCompleted[input.dataset.aspiration] = input.checked; persist(); };
  });
  // Kill button — mark sim as deceased at current year
  const killBtn = document.querySelector('[data-action="prompt-kill-sim"]');
  if(killBtn) killBtn.onclick = () => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:400px;border-top-color:var(--wax);">
        <div class="modal-pad">
          <h3 style="color:var(--wax);margin-bottom:10px;">Record death?</h3>
          <p style="font-size:14px;color:rgba(33,40,31,.7);line-height:1.6;margin:0 0 22px;">Mark <strong>${sim.firstName} ${sim.lastName}</strong> as deceased in the year <strong>${yearForDay(state.currentDay)}</strong>. You can edit the year on their profile afterward.</p>
          <div class="modal-actions"><div></div><div class="right">
            <button class="btn" id="kill-cancel-btn">Cancel</button>
            <button class="btn red" id="kill-confirm-btn">Confirm death</button>
          </div></div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = e => { if(e.target === overlay) overlay.remove(); };
    document.getElementById('kill-cancel-btn').onclick = () => overlay.remove();
    document.getElementById('kill-confirm-btn').onclick = () => {
      sim.status = 'Deceased';
      sim.yearOfDeath = sim.yearOfDeath || String(yearForDay(state.currentDay));
      overlay.remove();
      persist();
      showToast(`${sim.firstName} ${sim.lastName} marked as deceased`);
    };
  };

  // Delete sim with confirmation — modal popup
  const deleteBtn = document.querySelector('[data-action="prompt-delete-sim"]');
  if(deleteBtn) deleteBtn.onclick = () => {
    const sim = state.sims.find(s => s.id === selectedSimId);
    const simName = sim ? `${sim.firstName} ${sim.lastName}` : 'this sim';
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'delete-confirm-overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:400px;border-top-color:var(--wax);">
        <div class="modal-pad">
          <h3 style="color:var(--wax);margin-bottom:10px;">Delete sim?</h3>
          <p style="font-size:14px;color:rgba(33,40,31,.7);line-height:1.6;margin:0 0 22px;">This will permanently remove <strong>${simName}</strong> and all their data. There's no undoing this.</p>
          <div class="modal-actions"><div></div><div class="right">
            <button class="btn" id="delete-cancel-modal-btn">Cancel</button>
            <button class="btn red" id="delete-confirm-modal-btn">Yes, delete ${simName}</button>
          </div></div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = e => { if(e.target === overlay) overlay.remove(); };
    document.getElementById('delete-cancel-modal-btn').onclick = () => overlay.remove();
    document.getElementById('delete-confirm-modal-btn').onclick = () => {
      state.sims = state.sims.filter(s => s.id !== selectedSimId);
      overlay.remove();
      modal = null; simEditMode = false;
      persist();
      showToast('Sim deleted');
    };
  };

  // Marriage, child & parent action buttons
  const addMarriageBtn = document.querySelector('[data-action="open-add-marriage"]');
  if(addMarriageBtn) addMarriageBtn.onclick = () => { modal = 'add-marriage'; render(); };
  const addChildBtn = document.querySelector('[data-action="open-add-child"]');
  if(addChildBtn) addChildBtn.onclick = () => { modal = 'add-child'; render(); };
  const addParentsBtn = document.querySelector('[data-action="open-add-parents"]');
  if(addParentsBtn) addParentsBtn.onclick = () => { modal = 'add-parents'; render(); };
}

/* ---------------------------------------------------------
   PARENT SEARCH FIELD BINDING
--------------------------------------------------------- */
function bindParentSearchFields(){
  ['f-parent1','f-parent2','sim-parent1','sim-parent2','add-parent1','add-parent2','marriage-spouse','child-existing'].forEach(inputId => {
    const input = document.getElementById(inputId);
    const hiddenInput = document.getElementById(`${inputId}-id`);
    const panel = document.getElementById(`tal-dropdown-${inputId}`);
    if(!input || !panel || !hiddenInput) return;

    const positionPanel = () => {
      const rect = input.getBoundingClientRect();
      panel.style.top = (rect.bottom + 4) + 'px';
      panel.style.left = rect.left + 'px';
      panel.style.width = rect.width + 'px';
      panel.style.maxWidth = rect.width + 'px';
      panel.style.right = 'auto';
    };
    let _scrollListener = null;
    const openPanel = () => {
      positionPanel();
      panel.classList.add('open');
      if(!_scrollListener){
        _scrollListener = () => { if(panel.classList.contains('open')) positionPanel(); };
        window.addEventListener('scroll', _scrollListener, { passive: true });
        // Also reposition if the modal itself scrolls
        const modalEl = input.closest('.modal');
        if(modalEl) modalEl.addEventListener('scroll', _scrollListener, { passive: true });
      }
    };
    const closePanel = () => {
      panel.classList.remove('open');
      if(_scrollListener){
        window.removeEventListener('scroll', _scrollListener);
        const modalEl = input.closest('.modal');
        if(modalEl) modalEl.removeEventListener('scroll', _scrollListener);
        _scrollListener = null;
      }
    };

    const filterOptions = () => {
      const q = input.value.trim().toLowerCase();
      const opts = panel.querySelectorAll('[data-parent-pick]');
      opts.forEach(opt => {
        const name = (opt.dataset.parentName || '').toLowerCase();
        // always show the clear option
        if(!opt.dataset.parentName && opt.dataset.parentPick){
          opt.style.display = q ? 'none' : '';
          return;
        }
        (!q || name.includes(q)) ? opt.style.removeProperty('display') : opt.style.setProperty('display', 'none', 'important');
      });
    };

    input.onfocus = () => { openPanel(); filterOptions(); };
    input.oninput = () => { filterOptions(); if(!panel.classList.contains('open')) openPanel(); hiddenInput.value = ''; };
    input.onkeydown = e => { if(e.key === 'Escape'){ closePanel(); input.blur(); } };

    panel.querySelectorAll('[data-parent-pick]').forEach(opt => {
      opt.onmousedown = e => {
        e.preventDefault();
        const [, simId] = opt.dataset.parentPick.split('::');
        hiddenInput.value = simId || '';
        input.value = opt.dataset.parentName || '';
        closePanel();
      };
    });

    // close on outside click
    const outsideHandler = e => { if(!input.closest('.parent-tal-wrap').contains(e.target)) closePanel(); };
    const wrap = input.closest('.parent-tal-wrap');
    if(wrap){
      const key = `_parentOutside_${inputId}`;
      if(wrap[key]) document.removeEventListener('mousedown', wrap[key]);
      wrap[key] = outsideHandler;
      document.addEventListener('mousedown', outsideHandler);
    }
  });
}

// Track collapsed state across renders
const _collapsedSections = new Set();

function bindEvents(){
  if(calendarScrollHandler){ window.removeEventListener('scroll', calendarScrollHandler); calendarScrollHandler = null; }

  // Collapsible section headers
  document.querySelectorAll('.collapsible-trigger').forEach(trigger => {
    const targetId = trigger.dataset.collapseTarget;
    const body = targetId ? document.getElementById(targetId) : null;
    const arrow = trigger.querySelector('.collapse-arrow');
    if(!body) return;
    // Apply persisted collapsed state
    if(_collapsedSections.has(targetId)){
      body.classList.add('collapsed');
      if(arrow) arrow.style.transform = 'rotate(180deg)';
    }
    trigger.onclick = () => {
      const isNowCollapsed = body.classList.toggle('collapsed');
      if(arrow) arrow.style.transform = isNowCollapsed ? 'rotate(180deg)' : '';
      if(isNowCollapsed) _collapsedSections.add(targetId);
      else _collapsedSections.delete(targetId);
    };
  });

  bindParentSearchFields();

  document.querySelectorAll('.spine-nav button').forEach(btn => {
    btn.onclick = () => { view = btn.dataset.view; if(view === 'calendar'){ calendarMode='year'; calendarYear=yearForDay(state.currentDay); } render(); };
  });

  document.getElementById('export-btn').onclick = exportData;
  document.getElementById('import-btn').onclick = () => document.getElementById('file-input').click();
  document.getElementById('file-input').onchange = importData;

  document.querySelectorAll('[data-filter-cat]').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); listFilterCategory = btn.dataset.filterCat; view = 'event-list'; render(); };
  });

  if(view === 'event-list'){
    document.querySelector('[data-action="back-to-calendar"]').onclick = () => { view = 'calendar'; render(); };
    document.querySelectorAll('[data-calendar-day]').forEach(item => {
      item.onclick = () => { goToDay(Number(item.dataset.calendarDay)); render(); };
    });
  }

  if(view === 'timeline'){
    document.querySelector('[data-action="day-plus"]').onclick = () => { state.currentDay++; persist(); };
    document.querySelector('[data-action="open-date"]').onclick = () => { modal = 'date'; render(); };
    document.querySelector('[data-action="open-calendar"]').onclick = () => { view = 'calendar'; calendarMode = 'year'; calendarYear = yearForDay(state.currentDay); render(); };
    document.querySelectorAll('[data-upcoming-day]').forEach(item => item.onclick = e => { if(e.target.closest('[data-sim-link]') || e.target.closest('[data-filter-cat]')) return; goToDay(Number(item.dataset.upcomingDay)); render(); });
  }

  if(view === 'calendar'){
    const addHistory = document.querySelector('[data-action="open-add-history"]');
    if(addHistory) addHistory.onclick = () => { modal = 'add-history'; render(); };
    const search = document.getElementById('calendar-search');
    if(search) search.oninput = e => { calendarSearch = e.target.value; if(!calendarSearch) calendarIncludePast = false; render(); };
    const jumpYear = document.getElementById('jump-to-year');
    if(jumpYear){
      jumpYear.onkeydown = e => {
        if(e.key === 'Enter'){
          const val = parseInt(jumpYear.value, 10);
          if(!isNaN(val) && val >= 1300 && val <= 2030){
            if(calendarMode === 'decade'){ calendarDecade = Math.floor((val - 1300) / 10) * 10 + 1300; calendarYear = val; } else { calendarYear = val; }
            render();
            requestAnimationFrame(() => { const cell = document.querySelector(`[data-calendar-year="${val}"]`); if(cell) cell.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
          }
        }
      };
      jumpYear.oninput = e => {
        if(calendarMode === 'all'){
          const val = parseInt(jumpYear.value, 10);
          if(!isNaN(val) && val >= 1300 && val <= 2030){
            requestAnimationFrame(() => { const cell = document.querySelector(`[data-calendar-year="${val}"]`); if(cell) cell.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
          }
        }
      };
    }
    const includePastCheck = document.getElementById('include-past-check');
    if(includePastCheck) includePastCheck.onchange = () => { calendarIncludePast = includePastCheck.checked; render(); };

    const fdBtn = document.getElementById('filter-dropdown-btn');
    const fdPanel = document.getElementById('filter-dropdown-panel');
    const FILTER_LABELS = { all:'All Events', birthdays:'Birthdays', births:'Births', deaths:'Deaths', expiration:'Expiration Dates', 'historical-wars':'Wars', 'historical-outbreaks':'Outbreaks', 'historical-famines':'Famines', 'historical-others':'Other' };
    function updateFilterLabel(){ const lbl = document.getElementById('filter-dropdown-label'); if(!lbl) return; if(calendarCategory.includes('all')||calendarCategory.length===0) lbl.textContent='All Events'; else if(calendarCategory.length===1) lbl.textContent=FILTER_LABELS[calendarCategory[0]]||calendarCategory[0]; else lbl.textContent=calendarCategory.length+' filters active'; }
    if(fdBtn){ fdBtn.onclick = e => { e.stopPropagation(); filterDropdownOpen = !filterDropdownOpen; const newBtn = document.getElementById('filter-dropdown-btn'); const newPanel = document.getElementById('filter-dropdown-panel'); if(newBtn) newBtn.classList.toggle('open', filterDropdownOpen); if(newPanel) newPanel.classList.toggle('open', filterDropdownOpen); }; }
    if(fdPanel){
      fdPanel.querySelectorAll('input[data-filter-val]').forEach(cb => {
        cb.onchange = () => {
          const val = cb.dataset.filterVal;
          const allCb = fdPanel.querySelector('input[data-filter-val="all"]');
          const allSpecifics = Array.from(fdPanel.querySelectorAll('input[data-filter-val]')).filter(o => o.dataset.filterVal !== 'all');
          if(val === 'all'){ if(cb.checked){ allSpecifics.forEach(o => { o.checked = true; }); calendarCategory = ['all', ...allSpecifics.map(o => o.dataset.filterVal)]; } else { allSpecifics.forEach(o => { o.checked = false; }); calendarCategory = []; } }
          else { if(!cb.checked && allCb) allCb.checked = false; const checked = allSpecifics.filter(o => o.checked).map(o => o.dataset.filterVal); if(checked.length === allSpecifics.length){ if(allCb) allCb.checked = true; calendarCategory = ['all', ...checked]; } else { calendarCategory = checked; } }
          updateFilterLabel();
          const wasOpen = filterDropdownOpen;
          render();
          filterDropdownOpen = wasOpen;
          const newBtn = document.getElementById('filter-dropdown-btn');
          const newPanel = document.getElementById('filter-dropdown-panel');
          if(newBtn) newBtn.classList.toggle('open', filterDropdownOpen);
          if(newPanel) newPanel.classList.toggle('open', filterDropdownOpen);
        };
      });
    }
    document.addEventListener('click', function closeFd(e){ const fd = document.getElementById('filter-dropdown'); if(fd && !fd.contains(e.target)){ const b = document.getElementById('filter-dropdown-btn'); const p = document.getElementById('filter-dropdown-panel'); if(b) b.classList.remove('open'); if(p) p.classList.remove('open'); filterDropdownOpen = false; } });
    document.querySelectorAll('[data-delete-history]').forEach(btn => { btn.onclick = () => { const id = btn.dataset.deleteHistory; state.historicalEvents = state.historicalEvents.filter(ev => ev.id !== id); persist(); render(); }; });

    const previous = document.querySelector('[data-action="calendar-prev"]');
    if(previous) previous.onclick = () => { calendarDecade = Math.max(1300, calendarDecade - 10); render(); };
    const next = document.querySelector('[data-action="calendar-next"]');
    if(next) next.onclick = () => { calendarDecade += 10; render(); };
    const yearPrevious = document.querySelector('[data-action="calendar-year-prev"]');
    if(yearPrevious) yearPrevious.onclick = () => { calendarYear = Math.max(1300, calendarYear - 1); render(); };
    const yearNext = document.querySelector('[data-action="calendar-year-next"]');
    if(yearNext) yearNext.onclick = () => { calendarYear = Math.min(2030, calendarYear + 1); render(); };
    const dayPrevious = document.querySelector('[data-action="calendar-day-prev"]');
    if(dayPrevious) dayPrevious.onclick = () => { selectedDay = (selectedDay || state.currentDay) - 1; render(); };
    const dayNext = document.querySelector('[data-action="calendar-day-next"]');
    if(dayNext) dayNext.onclick = () => { selectedDay = (selectedDay || state.currentDay) + 1; render(); };
    const today = document.querySelector('[data-action="calendar-today"]');
    if(today) today.onclick = () => { calendarMode = 'day'; selectedDay = state.currentDay; calendarYear = yearForDay(state.currentDay); calendarDecade = Math.floor((calendarYear - 1300) / 10) * 10 + 1300; calendarSearch = ''; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    const dayMode = document.querySelector('[data-action="calendar-day-mode"]');
    if(dayMode) dayMode.onclick = () => { calendarMode = 'day'; selectedDay = selectedDay || state.currentDay; render(); };
    const yearMode = document.querySelector('[data-action="calendar-year"]');
    if(yearMode) yearMode.onclick = () => { calendarMode = 'year'; calendarYear = calendarYear || yearForDay(state.currentDay); render(); };
    const decadeMode = document.querySelector('[data-action="calendar-decade-mode"]');
    if(decadeMode) decadeMode.onclick = () => { calendarMode = 'decade'; calendarDecade = Math.floor((calendarYear - 1300) / 10) * 10 + 1300; render(); };
    const allMode = document.querySelector('[data-action="calendar-all-mode"]');
    if(allMode) allMode.onclick = () => { calendarMode = 'all'; calendarSearch = ''; calendarIncludePast = false; render(); };

    document.querySelectorAll('[data-calendar-year]').forEach(card => {
      card.onclick = e => { if(e.target.closest('[data-sim-link]') || e.target.closest('[data-filter-cat]')) return; calendarYear = Number(card.dataset.calendarYear); calendarMode = 'year'; selectedDay = null; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    });
    document.querySelectorAll('[data-calendar-day]').forEach(card => {
      card.onclick = e => { if(e.target.closest('[data-sim-link]') || e.target.closest('[data-filter-cat]')) return; goToDay(Number(card.dataset.calendarDay)); render(); };
    });
    if(calendarMode === 'day'){
      const dayJournal = document.querySelector('[data-action="day-journal"]');
      if(dayJournal) dayJournal.onclick = () => { const day = selectedDay || state.currentDay; view='journal'; if(state.notes[day] === undefined) state.notes[day]=''; render(); };
    }
    const scrollTopBtn = document.querySelector('.calendar-scroll-top');
    const headerCard = document.querySelector('.calendar-header-card');
    if(scrollTopBtn){
      scrollTopBtn.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
      if(headerCard){
        const updateScrollTopVisibility = () => { const pastHeader = headerCard.getBoundingClientRect().bottom < 0; scrollTopBtn.classList.toggle('visible', pastHeader); };
        updateScrollTopVisibility();
        window.addEventListener('scroll', updateScrollTopVisibility, { passive: true });
        calendarScrollHandler = updateScrollTopVisibility;
      }
    }
  }

  if(view === 'sim'){
    const sim = state.sims.find(item => item.id === selectedSimId);
    bindSimInfoForm(sim);
    document.querySelectorAll('[data-day-link]').forEach(el => el.onclick = () => { goToDay(Number(el.dataset.dayLink)); render(); });
  }

  document.querySelectorAll('[data-sim-link]').forEach(link => link.onclick = e => { e.stopPropagation(); selectedSimId=link.dataset.simLink; simEditMode=false; modal='sim-profile'; render(); });

  if(modal === 'sim-profile'){
    const sim = state.sims.find(item => item.id === selectedSimId);
    const closeProfileBtn = document.querySelector('[data-action="close-profile"]');
    if(closeProfileBtn) closeProfileBtn.onclick = () => { modal=null; simEditMode=false; render(); };
    const cancelSimInfoBtn = document.querySelector('[data-action="cancel-sim-info"]');
    if(cancelSimInfoBtn) cancelSimInfoBtn.onclick = () => { simEditMode=false; render(); };

    document.querySelectorAll('[data-day-link]').forEach(el => el.onclick = () => { goToDay(Number(el.dataset.dayLink)); modal='sim-profile'; simEditMode=false; render(); });

    if(cropBtn) cropBtn.onclick = () => { cropSimId = selectedSimId; modal='crop-photo'; render(); bindCropTool(); };
  }

  if(modal === 'crop-photo'){
    const overlay = document.getElementById('modal-overlay');
    // Only close on overlay click if the pointer went down on the overlay itself,
    // not if the drag started on the canvas and the mouse-up landed here.
    if(overlay){
      let overlayDownTarget = null;
      overlay.addEventListener('mousedown', e => { overlayDownTarget = e.target; });
      overlay.addEventListener('mouseup', e => {
        if(e.target === overlay && overlayDownTarget === overlay){
          modal='sim-profile'; cropSimId=null; render();
        }
        overlayDownTarget = null;
      });
    }
    const closeBtn = document.querySelector('[data-action="close-crop"]');
    if(closeBtn) closeBtn.onclick = () => { modal='sim-profile'; cropSimId=null; render(); };
    bindCropTool();
  }

  // ── Add Marriage modal ──
  if(modal === 'add-marriage'){
    const overlay = document.getElementById('modal-overlay');
    if(overlay) overlay.onclick = e => { if(e.target === overlay){ modal='sim-profile'; render(); } };
    const closeBtn = document.querySelector('[data-action="close-modal"]');
    if(closeBtn) closeBtn.onclick = () => { modal='sim-profile'; render(); };
    const saveMarriage = document.querySelector('[data-action="save-marriage"]');
    if(saveMarriage) saveMarriage.onclick = () => {
      const spouseId = (document.getElementById('marriage-spouse-id') || {}).value || '';
      const year = document.getElementById('marriage-year').value.trim();
      const sim = state.sims.find(s => s.id === selectedSimId);
      if(!sim) return;
      if(spouseId){
        sim.spouseId = spouseId;
        sim.yearMarried = year;
        // Also set reverse link on spouse
        const spouse = state.sims.find(s => s.id === spouseId);
        if(spouse){ spouse.spouseId = sim.id; if(!spouse.yearMarried) spouse.yearMarried = year; }
      }
      modal = null;
      persist();
      showToast('Marriage recorded');
    };
  }

  // ── Add Child modal ──
  if(modal === 'add-child'){
    const overlay = document.getElementById('modal-overlay');
    if(overlay) overlay.onclick = e => { if(e.target === overlay){ modal='sim-profile'; render(); } };
    const closeBtn = document.querySelector('[data-action="close-modal"]');
    if(closeBtn) closeBtn.onclick = () => { modal='sim-profile'; render(); };
    // Link existing sim
    const saveChildExisting = document.querySelector('[data-action="save-child-existing"]');
    if(saveChildExisting) saveChildExisting.onclick = () => {
      const childId = (document.getElementById('child-existing-id') || {}).value || '';
      if(!childId){ showToast('Please select a sim first'); return; }
      const child = state.sims.find(s => s.id === childId);
      const sim = state.sims.find(s => s.id === selectedSimId);
      if(child && sim){
        if(!(child.parentIds || []).includes(sim.id)) child.parentIds = [...(child.parentIds || []), sim.id];
      }
      modal = null;
      persist();
      showToast('Child linked');
    };
    // Create new sim as child
    const addChildNewSim = document.querySelector('[data-action="add-child-new-sim"]');
    if(addChildNewSim) addChildNewSim.onclick = () => {
      pendingChildParentId = selectedSimId;
      modal = null;
      editingSimId = 'new';

    };

  if(view === 'rules'){
    document.querySelectorAll('[data-action="open-rule-book"]').forEach(book => {
      book.onclick = () => { modal = { title: book.dataset.ruleTitle, dates: book.dataset.ruleDates }; render(); };
    });

  if(view === 'journal'){
    document.querySelectorAll('[data-note-day]').forEach(ta => { ta.onchange = () => { const d = ta.dataset.noteDay; state.notes[d] = ta.value; persist(); }; });
    document.querySelector('[data-action="new-entry"]').onclick = () => { const v = document.getElementById('new-entry-day').value; if(v !== '' && state.notes[v] === undefined){ state.notes[v] = ''; persist(); } };
  }

  if(view === 'roster'){
    document.getElementById('roster-search').oninput = (e) => { rosterSearch = e.target.value; render(); };
    document.querySelectorAll('[data-roster-view]').forEach(button => { button.onclick = () => { rosterView = button.dataset.rosterView; render(); }; });
    document.querySelectorAll('[data-action="new-sim"]').forEach(el => { el.onclick = () => { editingSimId = 'new'; render(); }; });
    document.querySelectorAll('[data-sim]').forEach(item => { item.onclick = e => { if(e.target.closest('th')) return; selectedSimId = item.dataset.sim; simEditMode=false; modal='sim-profile'; render(); }; });
    document.querySelectorAll('[data-roster-sort]').forEach(th => {
      th.onclick = () => {

        if(rosterSortCol === col){ rosterSortDir *= -1; } else { rosterSortCol = col; rosterSortDir = 1; }
        render();
      };
    });

  if(editingSimId){
    const overlay = document.getElementById('modal-overlay');
    overlay.onclick = (e) => { if(e.target === overlay){ editingSimId = null; pendingChildParentId = null; render(); } };
    document.querySelector('[data-action="close-modal"]').onclick = () => { editingSimId = null; pendingChildParentId = null; render(); };
    const statusSel = document.getElementById('f-status');
    if(statusSel) statusSel.onchange = () => { const show = statusSel.value === 'Deceased'; document.querySelectorAll('.death-field').forEach(el => el.style.display = show ? 'block' : 'none'); };
    document.querySelector('[data-action="save-sim"]').onclick = saveSim;
    const delBtn = document.querySelector('[data-action="delete-sim"]');
    if(delBtn) delBtn.onclick = () => { state.sims = state.sims.filter(s => s.id !== editingSimId); editingSimId = null; persist(); };
  }

  // ── Add Parents modal ──
  if(modal === 'add-parents'){
    const overlay = document.getElementById('modal-overlay');
    if(overlay) overlay.onclick = e => { if(e.target === overlay){ modal='sim-profile'; render(); } };
    const closeBtn = document.querySelector('[data-action="close-modal"]');
    if(closeBtn) closeBtn.onclick = () => { modal='sim-profile'; render(); };
    bindParentSearchFields();
    const saveParents = document.querySelector('[data-action="save-parents"]');
    if(saveParents) saveParents.onclick = () => {
      const parent1Id = (document.getElementById('add-parent1-id') || {}).value || '';
      const parent2Id = (document.getElementById('add-parent2-id') || {}).value || '';
      const sim = state.sims.find(s => s.id === selectedSimId);
      if(sim){
        const newParents = [parent1Id, parent2Id].filter(Boolean);
        sim.parentIds = newParents;
      }
      modal = null;
      persist();
      showToast('Parents saved');
    };
  }

  if(modal && typeof modal === 'object' && modal !== null){
    // rule-book modal
    const overlay = document.getElementById('modal-overlay');
    if(overlay) overlay.onclick = e => { if(e.target === overlay){ modal = null; render(); } };
    const genericClose = document.querySelector('[data-action="close-modal"]');
    if(genericClose) genericClose.onclick = () => { modal = null; render(); };
  }

  if(modal === 'date'){
    const overlay = document.getElementById('modal-overlay');
    if(overlay) overlay.onclick = e => { if(e.target === overlay){ modal = null; render(); } };
    const dateInput = document.getElementById('date-modal-input');
    if(dateInput){
      dateInput.oninput = () => { document.getElementById('date-preview-day').textContent = dateInput.value || '—'; };
      const closeBtn = document.querySelector('[data-action="close-modal"]');
      if(closeBtn) closeBtn.onclick = () => { modal = null; render(); };
      document.querySelector('[data-action="save-date"]').onclick = () => { const value = parseInt(dateInput.value, 10); if(!isNaN(value) && value >= 1){ state.currentDay = value; modal = null; persist(); } };
    }
  }

  if(modal === 'add-history'){
    const overlay = document.getElementById('modal-overlay');
    if(overlay) overlay.onclick = e => { if(e.target === overlay){ modal = null; render(); } };
    const closeBtn = document.querySelector('[data-action="close-modal"]');
    if(closeBtn) closeBtn.onclick = () => { modal = null; render(); };
    const histSubcat = document.getElementById('hist-subcat');
    const saveHistory = document.querySelector('[data-action="save-history"]');
    if(histSubcat && saveHistory) histSubcat.onchange = () => { saveHistory.disabled = !histSubcat.value; };
    const saveHistBtn = document.querySelector('[data-action="save-history"]');
    if(saveHistBtn) saveHistBtn.onclick = () => {
      const startYear = parseInt(document.getElementById('hist-start-year').value, 10);
      const endYearInput = document.getElementById('hist-end-year').value.trim();
      const endYear = endYearInput ? parseInt(endYearInput, 10) : startYear;
      const subcat = document.getElementById('hist-subcat').value;
      const text = document.getElementById('hist-text').value.trim();
      if(!isNaN(startYear) && !isNaN(endYear) && endYear >= startYear && subcat && text){
        const startDay = firstDayOfYear(startYear);
        const endDay = firstDayOfYear(endYear) + 3;
        state.historicalEvents.push({ id: cryptoId(), startDay, endDay, subcat, text });
        modal = null;
        persist();
        render();
      }
    };
  }

  document.onkeydown = e => {
    if(e.key === 'Escape' && (editingSimId || modal)){
      editingSimId = null;
      pendingChildParentId = null;
      modal = null;
      render();
    }
  };
}

function collectFormValues(){
  const parent1 = (document.getElementById('f-parent1-id') || {}).value || '';
  const parent2 = (document.getElementById('f-parent2-id') || {}).value || '';
  return {
    firstName: document.getElementById('f-firstName').value.trim(),
    lastName: document.getElementById('f-lastName').value.trim(),
    generation: document.getElementById('f-generation').value.trim(),
    sex: document.getElementById('f-sex').value,
    parentIds: [parent1, parent2].filter(Boolean),
    spouseId: '',
    birthDay: parseInt(document.getElementById('f-birthDay').value, 10) || 0,
    yearBorn: document.getElementById('f-yearBorn').value.trim(),
    status: document.getElementById('f-status').value,
    nationality: document.getElementById('f-nationality').value.trim(),
    yearOfDeath: document.getElementById('f-yearOfDeath') ? document.getElementById('f-yearOfDeath').value.trim() : '',
    causeOfDeath: document.getElementById('f-causeOfDeath') ? document.getElementById('f-causeOfDeath').value.trim() : '',
    yearMarried: '',
    family: document.getElementById('f-family').value.trim(),
    notes: document.getElementById('f-notes').value,
  };
}

function saveSim(){
  const vals = collectFormValues();
  if(editingSimId === 'new'){
    const newId = cryptoId();
    const newSim = Object.assign({ id: newId, traits:[], aspirations:[], lifestyles:[], aspirationCompleted:{} }, vals);
    // If triggered from add-child flow, inject the parent
    if(pendingChildParentId){
      if(!newSim.parentIds.includes(pendingChildParentId)) newSim.parentIds = [pendingChildParentId, ...newSim.parentIds].filter(Boolean);
      pendingChildParentId = null;
    }
    state.sims.push(newSim);
  } else {
    Object.assign(state.sims.find(s => s.id === editingSimId), vals);
  }
  editingSimId = null;
  persist();
  showToast('Sim saved');
}

/* ---------------------------------------------------------
   IMPORT / EXPORT
--------------------------------------------------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bond-chronicle-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const parsed = JSON.parse(evt.target.result);
      if(parsed && Array.isArray(parsed.sims)){ state = parsed; persist(); }
      else alert("This file doesn't look like a Bond Chronicle backup.");
    }catch(err){ alert("Could not read that file — make sure it's a backup saved from this app."); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

render();
</script>
</body>
</html>
